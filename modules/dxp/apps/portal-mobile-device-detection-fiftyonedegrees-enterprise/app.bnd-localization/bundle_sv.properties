liferay-releng-app-description=Med den här appen kan Liferay upptäcka vilken mobilenhet eller vilket operativsystem som används för en förfrågan och ändra layout/rendering för sidor baserat på vilken enhet som upptäcks. När den installerats kan du definiera nya regler för mobilenheten och använda dem på webbplatser och enskilda sidor. Antalet mobilenhetsanvändare som söker på webben har ökat så det är viktigt att kunna hantera olika sorters enheter korrekt. Du kan exempelvis konfigurera utseendet och känslan på Liferay-sidorna som öppnas av användare av smarttelefoner eller surfplattor på annat sätt än PC-användare. Både webbplatser och enskilda sidor kan konfigureras med ett visst antal regelgrupper som designats för att beskriva en grupp med enheter. De kan innehålla en eller fler regler som beskriver en kategori med enheter, till exempel alla Android-enheter eller alla iOS-surfplattor. Regelgrupper kan prioriteras för att avgöra vilken som ska tillämpas för en specifik sidförfrågan. Du kan definiera så många regler du behöver för att klassificera alla enheter du vill vidta åtgärder på. Enhetens databas i den här appen inkluderar ungefär 600 000 enhetskombinationer (enhets-, programvaru- och webbläsarkombinationer) och 200 egenskaper.<br /><br />Den här appen installeras som en Liferay-tjänst.