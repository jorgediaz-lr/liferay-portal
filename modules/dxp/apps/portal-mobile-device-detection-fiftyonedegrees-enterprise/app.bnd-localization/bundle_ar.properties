liferay-releng-app-description=يتيح هذا التطبيق لـ Liferay اكتشاف ما هو الجهاز المحمول أو نظام التشغيل الذي يجري استخدامه في أي طلب معين وتبديل التخطيط / عرض الصفحات استنادًا إلى الجهاز المكتشف. بمجرد التثبيت، يمكنك تحديد قواعد جديدة للأجهزة المحمولة وتطبيقها على المواقع والصفحات الفردية. يتزايد بشكل ثابت نسبة الأجهزة المحمولة التي يستخدمها المستخدمون في تصفح الويب لذا من المهم أن تكون قادرًا على التعامل مع أنواع مختلفة من الأجهزة بشكل مناسب. على سبيل المثال، يمكنك تكوين مظهر وشكل صفحات Liferay التي يصل إليها مستخدمو الهواتف الذكية أو الأجهزة اللوحية بشكل مختلف عن تلك الذي يصل إليها مستخدمو أجهزة الكمبيوتر الشخصي. ويمكن تكوين كل من المواقع والصفحات الفردية بأي عدد من مجموعات القواعد المصممة لوصف مجموعة من الأجهزة. ويمكن أن يتضمن إحدى القواعد أو أكثر التي تصف فئة من الأجهزة، مثل جميع أجهزة android أو جميع أجهزة iOS اللوحية. ويمكن تحديد أولوية مجموعات القواعد لاختيار أيها سيتم تطبيقه على طلب صفحة معين. يمكنك تحديد أي عدد من القواعد تريده لتصنيف جميع الأجهزة التي تريد اتخاذ إجراء عليها. تشمل قاعدة بيانات الجهاز في هذا التطبيق حولي 600,000 توليفة جهاز (جهاز وبرنامج ومستعرض) و200 خاصية.<br /><br />يتم تثبيت هذه التطبيق كخدمة Liferay.