liferay-releng-app-description=Ez az alkalmazás lehetővé teszi, hogy a Liferay felismerje, milyen mobil eszközt vagy operációs rendszert használtak egy adott kérelemhez, és az észlelt eszköznek megfelelően megváltoztassa az oldalak elrendezését/kialakítását. A telepítés után meghatározhatja az új mobil eszközökre vonatkozó szabályokat, és alkalmazhatja a webhelyekre és az egyes oldalakra. A böngészéshez mobil eszközöket használó felhasználók aránya rohamosan emelkedik, ezért fontos, hogy megfelelően tudjuk kezelni a különböző típusú eszközöket. Például az okostelefonokból vagy táblagépekből megnyitott Liferay-oldalak megjelenését a PC felhasználók oldalai megjelenésétől eltérőre konfigurálhatja. A webhelyek és az egyes oldalak egyaránt tetszőleges számú, bizonyos eszközcsoportoknak megfelelő szabálycsoporttal konfigurálhatók. Tartalmazhatnak egy vagy több szabályt, amelyek egy eszközkategóriát, például Android eszközöket vagy iOS táblagépeket írnak le. A szabálycsoportok prioritásának a definiálására is lehetőség van, így meghatározhatja, hogy egy konkrét oldal lekérése esetén melyik szabály kerüljön alkalmazásra. Szükség szerinti számú szabályt állíthat fel, hogy minden támogatni kívánt eszközt besoroljon. Az alkalmazás által tartalmazott eszköz-adatbázisban megközelítőleg 600 000 eszközkombináció (eszközök, szoftverek és böngészők kombinációi) és 200 tulajdonság található.<br /><br />Az alkalmazás Liferay szolgáltatásként telepítődik.