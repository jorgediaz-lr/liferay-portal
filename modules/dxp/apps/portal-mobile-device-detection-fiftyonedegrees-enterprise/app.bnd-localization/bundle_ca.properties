liferay-releng-app-description=Aquesta aplicació permet que Liferay detecti quin dispositiu mòbil o sistema operatiu s'utilitza per a qualsevol sol·licitud i altera la disposició/renderització de pàgines en funció del dispositiu detectat. Un cop instal·lada, podeu definir noves regles de dispositius mòbils i aplicar-les als llocs web i les pàgines individuals. La proporció d'usuaris de dispositius mòbils que naveguen pel web s'ha anat incrementant constantment, de manera que és important poder gestionar adequadament diversos tipus de dispositius. Per exemple, es pot configurar l'aspecte i el comportament de les pàgines de Liferay a què accedeixen els usuaris de telèfon intel·ligent o tauleta d'una manera diferent de les pàgines a què accedeixen els usuaris de PC. Tots dos llocs web i pàgines individuals es poden configurar amb qualsevol nombre de grups de normes dissenyades per descriure un grup de dispositius. Pot contenir una o més normes que descriguin una categoria de dispositius, com ara tots els dispositius Android o totes les tauletes iOS. Els grups de regles es poden prioritzar per determinar quin s'aplicarà a una sol·licitud de pàgina determinada. Podeu definir totes les regles que necessiteu per classificar tots els dispositius en què vulgueu actuar. La base de dades del dispositiu d'aquesta aplicació inclou unes 600.000 combinacions de dispositius (combinacions de dispositiu, programari i navegador) i 200 propietats.<br /><br />Aquesta aplicació s'instal·la com a servei de Liferay.