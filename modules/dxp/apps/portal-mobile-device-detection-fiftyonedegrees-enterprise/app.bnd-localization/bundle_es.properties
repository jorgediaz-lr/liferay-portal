liferay-releng-app-description=Esta aplicación permite a Liferay detectar el dispositivo móvil o el sistema operativo usado para cualquier petición específica, y modifica el diseño o renderizado de las páginas basándose en el dispositivo detectado. Después de instalarla, podrá definir nuevas reglas de dispositivos móviles y aplicarlas en sitios y páginas individuales. La proporción de usuarios con dispositivos móviles que navegan por Internet aumenta progresivamente, por lo que es importante gestionar distintos tipos de dispositivos de forma correcta. Por ejemplo, puede configurar la apariencia de las páginas de Liferay que visitan usuarios de smartphones o tabletas para que sean distintas de las páginas mostradas a los usuarios de equipos PC. Tanto las páginas individuales como los sitios se pueden configurar con cualquier número de grupos de reglas diseñadas para describir un grupo de dispositivos. Pueden contener una o más reglas que describan una categoría de dispositivos (por ejemplo, todos los dispositivos Android o todas las tabletas que ejecuten iOS). Los grupos de reglas se pueden priorizar para determinar cuál se aplicará para una petición de página específica. Puede definir tantas reglas como sea necesario para clasificar todos los dispositivos en los que quiera realizar alguna acción. En la base de datos de dispositivos de la aplicación, se incluyen aproximadamente 600 000 combinaciones de dispositivos (combinaciones de dispositivo, software y navegador) y 200 propiedades.<br /><br />Esta aplicación se instala como un servicio de Liferay.