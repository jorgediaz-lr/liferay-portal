liferay-releng-app-description=借助 ${liferay.releng.app.title.prefix} Enterprise Search Security 应用，您可以将 Liferay DXP 实例连接到 Elasticsearch 群集。<br />根据 Elastic 网站，"利用 Security，您可以通过密码保护数据以及实施更先进的安全措施，例如加密通信、基于角色的访问控制、IP 过滤和审核。"<br />有关 Elasticsearch 安全性的更多信息，请访问 https://www.elastic.co/guide/en/elastic-stack-overview/6.8/elasticsearch-security.html。<br />要了解兼容性，请参见兼容性矩阵：https://help.liferay.com/hc/en-us/articles/360016511651#Liferay-Enterprise-Search。