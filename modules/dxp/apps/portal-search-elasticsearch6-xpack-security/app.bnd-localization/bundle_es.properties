liferay-releng-app-description=La aplicación ${liferay.releng.app.title.prefix} Enterprise Search Security le permite conectar su instancia de Liferay DXP a un clúster de Elasticsearch.<br />Según se indica en el sitio web de Elastic: «Con Security, puede proteger con contraseña sus datos, así como implementar medidas de seguridad más avanzadas, como cifrado de las comunicaciones, control de acceso basado en roles, filtrado de IP y auditorías».<br />Para obtener más información sobre la seguridad de Elasticsearch, consulte https://www.elastic.co/guide/en/elastic-stack-overview/6.8/elasticsearch-security.html.<br />Para obtener más información sobre compatibilidad, consulte la matriz de compatibilidad: https://help.liferay.com/hc/es-es/articles/360016511651#Liferay-Enterprise-Search.