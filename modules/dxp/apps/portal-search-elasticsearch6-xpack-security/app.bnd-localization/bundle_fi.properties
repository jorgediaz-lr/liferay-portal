liferay-releng-app-description=Enterprise Search Security -sovelluksen ${liferay.releng.app.title.prefix} avulla voit liittää Liferay DXP -instanssin Elasticsearch-klusteriin.<br />Elasticin verkkosivustolta: "Suojauksella voit suojata tietosi salasanalla sekä toteuttaa kehittyneempiä turvatoimia, kuten viestien salaaminen, roolipohjainen pääsynvalvonta, IP-suodatus ja auditointi."<br />Lisätietoja Elasticsearch-suojauksesta löytyy osoitteesta https://www.elastic.co/guide/en-us/Flexible-stack-Overview/6.8/elasticsearch-security.html.<br />Lisätietoja yhteensopivuudesta on yhteensopivuusmatriisissa: https://help.liferay.com/hc/en-us/articles/360016511651# Liferay-Enterprise-Search.