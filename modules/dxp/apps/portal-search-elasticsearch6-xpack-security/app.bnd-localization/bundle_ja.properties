liferay-releng-app-description=The ${liferay.releng.app.title.prefix} Enterprise Search Securityアプリは、Liferay DXPインスタンスをElasticsearchクラスターに接続できるようにします。<br />ElasticのWebサイトには「Securityを使用すると、データをパスワードで保護できるだけでなく、通信の暗号化、ロールベースのアクセス制御、IPフィルタリング、監査などの高度なセキュリティ対策を実施することができます。」と書かれています。<br />Elasticsearch Securityに関する詳細は、https://www.elastic.co/guide/en/elastic-stack-overview/6.8/elasticsearch-security.html を参照してください。<br />互換性に関する情報は、互換性マトリクス（https://help.liferay.com/hc/en-us/articles/360016511651#Liferay-Enterprise-Search）を参照してください。