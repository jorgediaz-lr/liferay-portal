liferay-releng-app-description=L'aplicació ${liferay.releng.app.title.prefix} Enterprise Search Security us permet connectar la vostra instància de Liferay DXP a un clúster d'Elasticsearch.<br />Des del lloc web d'Elasticsearch: "Amb seguretat, podeu protegir les vostres dades amb contrasenya, així com implementar més mesures de seguretat avançades, com ara encriptar comunicacions, control d'accés basat en rols, filtratge IP i auditoria."<br />Es pot trobar més informació sobre la seguretat d'Elasticsearch a https://www.elastic.co/guide/en/elastic-stack-overview/6.8/elasticsearch-security.html.<br />Per obtenir informació sobre la compatibilitat, consulteu la matriu de compatibilitat: https://help.liferay.com/hc/en-us/articles/360016511651#Liferay-Enterprise-Search.