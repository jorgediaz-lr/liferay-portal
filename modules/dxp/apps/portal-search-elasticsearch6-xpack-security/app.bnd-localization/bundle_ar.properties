liferay-releng-app-description=يسمح تطبيق ${liferay.releng.app.title.prefix} Enterprise Search Security لك بتوصيل مثيل Liferay DXP الخاص بك بنظام مجموعات Elasticsearch.<br />من موقع ويب Elastic، "من خلال ميزة الأمان، يمكن حماية بياناتك بكلمة مرور بالإضافة إلى تطبيق إجراءات أمان متقدمة مثل تشفير الاتصالات، والتحكم في الوصول إلى الدور، وتصفية عنوان IP والتدقيق."<br />يمكن العثور على مزيد من المعلومات حول أمان Elasticsearch على https://www.elastic.co/guide/en/elastic-stack-overview/6.8/elasticsearch-security.html.<br />لتعلُّم المزيد حول التوافق، انظر مخطط التوافق: https://help.liferay.com/hc/en-us/articles/360016511651#Liferay-Enterprise-Search.