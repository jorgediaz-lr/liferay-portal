liferay-releng-app-description=Med ${liferay.releng.app.title.prefix} Enterprise Search Security-appen kan du ansluta din Liferay DXP-instans till ett Elasticsearch-kluster.<br />Från Elastics webbplats, "Med Security kan du lösenordsskydda dina data samt använda mer avancerade säkerhetsåtgärder som att kryptera din kommunikation, rollbaserad åtkomstkontroll, IP-filter och granskning."<br />Mer information om Elasticsearch-säkerhet finns på https://www.elastic.co/guide/en/elastic-stack-overview/6.8/elasticsearch-security.html.<br />Om du vill veta mer om kompatibilitet kan du kolla in kompatibilitetsmatrisen: https://help.liferay.com/hc/en-us/articles/360016511651#Liferay-Enterprise-Search.