liferay-releng-app-description=Az ${liferay.releng.app.title.prefix} Enterprise Search Security alkalmazás lehetővé teszi, hogy Liferay DXP példányát egy Elasticsearch fürthöz csatlakoztassa.<br />Az Elastic weboldala szerint "A Security segítségével jelszóval védheti adatait, és fejlettebb biztonsági intézkedéseket foganatosíthat, mint például a kommunikáció titkosítása, szerepkör-alapú hozzáférés-vezérlés, IP-szűrés és felülvizsgálat."<br />Az Elasticsearch biztonsági funkciójáról a https://www.elastic.co/guide/en/elastic-stack-overview/6.8/elasticsearch-security.html címen talál további információkat.<br />A kompatibilitással kapcsolatban tekintse meg a kompatibilitási mátrixot: https://help.liferay.com/hc/en-us/articles/360016511651#Liferay-Enterprise-Search.