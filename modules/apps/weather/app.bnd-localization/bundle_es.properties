liferay-releng-app-description=Esta aplicación muestra de forma rápida y visual el tiempo en un conjunto de ubicaciones configurable. Las ubicaciones se pueden especificar mediante un nombre de ciudad textual (como «Los Ángeles, California» o «China»), o bien mediante un código postal (por ejemplo, 32701 en Estados Unidos). Para cada ubicación, se proporcionan enlaces a una pantalla de resumen en OpenWeatherMap.org. Las lecturas de temperatura se pueden configurar en grados Celsius o Fahrenheit.<br /><br />La aplicación se mostrará en el menú Aplicación después instalarla.