liferay-releng-app-description=يوفر هذا التطبيق إشارة مرئية سريعة للطقس عبر مجموعة قابلة للتكوين من المواقع. ويمكن تحديد المواقع باستخدام اسم مدينة نصي (مثل "لوس أنجلوس، CA" أو "الصين") أو رمز بريدي (مثل 32701 في الولايات المتحدة). ويتم توفير روابط إلى شاشة ملخص في OpenWeatherMap.org لكل موقع. ويمكن تكوين قراءة درجة الحرارة على الدرجة المئوية أو الدرجة الفهرنهايت.<br /><br />يظهر هذا التطبيق في قائمة التطبيقات الخاصة بك بمجرد تثبيته.