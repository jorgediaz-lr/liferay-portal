liferay-releng-app-description=Aquesta aplicació proporciona una indicació visual ràpida de la meteorologia en un conjunt d'ubicacions configurable. Les ubicacions es poden especificar amb un nom de ciutat textual (com ara "Los Angeles, CA" o "Xina"), o un codi postal (com ara 32701 als EUA). Es proporcionen enllaços a una pantalla de resum d'OpenWeatherMap.org per a cada ubicació. Les lectures de temperatura es poden configurar per a Celsius o Fahrenheit.<br /><br />Aquesta aplicació apareixerà al menú de la vostra aplicació un cop instal·lada.