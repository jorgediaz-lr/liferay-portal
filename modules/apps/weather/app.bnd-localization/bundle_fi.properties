liferay-releng-app-description=Tämä sovellus tarjoaa nopean visuaalisen sääennusteen määritettävissä olevissa paikoissa. Sijainnit voidaan määrittää käyttämällä kaupungin tekstinimeä (kuten "Los Angeles, CA" tai "Kiina") tai postinumeroa (kuten 32701 Yhdysvalloissa). Linkit yhteenvetonäyttöön osoitteessa OpenWeatherMap.org löytyvät jokaiselle sijainnille. Lämpötilalukemat voidaan määrittää celsius- tai fahrenheit-asteikolle.<br /><br />Tämä sovellus näkyy sovellusvalikossasi, kun se on asennettu.