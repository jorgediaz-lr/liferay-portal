liferay-releng-app-description=Appen erbjuder en snabb visuell väderindikering för en uppsättning med platser som kan konfigureras. Platser kan anges med ett stadsnamn (t.ex. "Los Angeles, CA" eller "Kina") eller ett postnummer (t.ex. 32701 i USA). Länkar till en sammanfattningsskärm på OpenWeatherMap.org tillhandahålls för varje plats. Temperaturläsning kan konfigureras för Celsius eller Fahrenheit.<br /><br />Den här appen visas i din programmeny när den installerats.