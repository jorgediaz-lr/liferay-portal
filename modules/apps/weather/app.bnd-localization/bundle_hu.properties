liferay-releng-app-description=Ez az alkalmazás gyors képet ad néhány hely konfigurálható listájának az időjárásról. A helyek szöveges városnévként (például "Los Angeles, CA" vagy "Kína"), vagy postai irányítószánként (például az USA-ban 32701) adhatók meg. Az egyes helyekhez hivatkozásokat ad meg az OpenWeatherMap.org összefoglaló képernyőjére. A hőmérséklet-adatok Celsius vagy Fahrenheit fokra konfigurálhatók.<br /><br />Az alkalmazás a telepítés után az Alkalmazás menüben jelenik meg.