liferay-releng-app-description=Den här appen gör det enkelt att bädda in Youtube-videor på Liferay-sidor. Storlek, placering och användaralternativ kan konfigureras för att optimera videons utseende och tillåta saker som uppspelning på helskärm.<br /><br />Den här appen visas i din programmeny när den installerats.