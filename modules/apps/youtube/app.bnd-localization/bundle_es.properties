liferay-releng-app-description=Esta aplicación permite insertar fácilmente vídeos de YouTube en páginas de Liferay. El tamaño, la colocación y las opciones de usuario se pueden configurar para optimizar la apariencia visual del vídeo y permitir acciones como la reproducción en pantalla completa.<br /><br />La aplicación se mostrará en el menú Aplicación después de instalarla.