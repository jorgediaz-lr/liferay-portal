liferay-releng-app-description=Az alkalmazás megkönnyíti a Youtube-videók Liferay-oldalakra való beágyazását. A méret, elhelyezés és a felhasználó lehetőségei konfigurálhatók, hogy optimalizálja a videó vizuális megjelenését, és lehetővé tegyen olyan funkciókat, mint például a teljes képernyős lejátszás.<br /><br />Az alkalmazás a telepítés után az Alkalmazás menüben jelenik meg.