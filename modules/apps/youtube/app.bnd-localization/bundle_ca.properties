liferay-releng-app-description=Aquesta aplicació facilita la incrustació de vídeos de YouTube a les pàgines de Liferay. Les opcions de mida, col·locació i usuari es poden configurar per optimitzar l'aparença visual del vídeo i permetre coses com ara la reproducció en pantalla completa.<br /><br />Aquesta aplicació es mostrarà al menú de la vostra aplicació un cop instal·lada.