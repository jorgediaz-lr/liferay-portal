liferay-releng-app-description=Tämän sovelluksen avulla on helppo upottaa Youtube-videoita Liferay-sivuille. Koko, sijoittelu ja käyttäjäasetukset voidaan määrittää optimoimaan videon visuaalinen ulkonäkö ja mahdollistamaan esimerkiksi koko näytön toisto.<br /><br />Tämä sovellus näkyy sovellusvalikossasi, kun se on asennettu.