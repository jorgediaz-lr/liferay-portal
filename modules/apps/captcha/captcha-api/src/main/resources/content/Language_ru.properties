simple-captcha-noise-producers-help=Имена классов ввода, которые реализуют nl.captcha.noise.NoiseProducer. Эти классы будут случайным образом использоваться Simple CAPTCHA для добавления шума к изображению captcha. (Automatic Translation)
simple-captcha-text-producers=Простые производители текста CAPTCHA (Automatic Translation)
