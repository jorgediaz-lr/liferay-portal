simple-captcha-background-producers-help=Voer klassenamen in die nl.captcha.backgrounds.BackgroundProducer implementeren. Deze klassen worden willekeurig door Simple CAPTCHA gebruikt om een achtergrond te genereren voor een captcha-afbeelding.
simple-captcha-gimpy-renderers=簡單碼 Gimpy Renderers
simple-captcha-gimpy-renderers-help=Voer klassenamen in die nl.captcha.gimpy.GimpyRenderer implementeren. Deze klassen worden willekeurig door Simple CAPTCHA gebruikt om een captcha-afbeelding te vervormen.
