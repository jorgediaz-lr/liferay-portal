custom-field-hidden-help=Nastavení vlastního pole na skryté znamená, že hodnota pole se nikdy nezobrazí v žádném uživatelském rozhraní kromě tohoto. To umožňuje pole použít pro více obskurní a pokročilé účely, jako je například slouží jako zástupný symbol pro vlastní oprávnění. (Automatic Translation)
custom-field-index-type-help=Nastavení vlastního pole na prohledávatelné znamená, že hodnota pole je indexována při změně entity (například Uživatel). Prohledávatelná lze pouze pole java.lang.String. Všimněte si, že pokud je nově prohledávatelné pole, musí být indexy aktualizovány předtím, než budou data k dispozici pro vyhledávání. (Automatic Translation)
custom-field-key-help=Klíč uživatelského pole se používá k přístupu k poli programově přes štítek
custom-field-localize-field-name-help=Nastavení vlastního pole na název lokalizovatelného pole znamená, že název pole bude lokalizován podle klíčů jazyka definovaných v souboru vlastností jazyka. Informace o přepsání výchozích jazykových klíčů naleznete v dokumentaci. (Automatic Translation)
custom-field-precision-help=Přesnost nastavuje délku čísla. (Automatic Translation)
custom-field-secret-help=Nastavení vlastního pole na tajné znamená, že psaní je skryto na obrazovce. Použijte to pro hesla. (Automatic Translation)
custom-field-visible-with-update-permission-help=Nastavení uživatelského pole na Viditelné pro úpravy znamená, že uživatel který má práva na úpravu pole toto pole uvidí. Toto nastavení je v takovém případě nadřazeno vlastnosti Skryté.
custom-fields-are-not-enabled-for-any-resource=Uživatelská pole jsou vypnuta pro všechny zdroje.
