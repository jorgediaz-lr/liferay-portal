custom-field-hidden-help=Özel bir alanın gizliolarak ayarlanması, alanın değerinin bunun dışında hiçbir kullanıcı arabiriminde gösterilmeyecektir anlamına gelir. Bu, alanın özel izinler için yer tutucu olarak hareket etmek gibi daha belirsiz ve gelişmiş amaçlar için kullanılmasını sağlar. (Automatic Translation)
custom-field-index-type-help=Özel bir alanın aranabilir olarak ayarlanması, varlık (Kullanıcı gibi) değiştirildiğinde alanın değerinin dizine eklenmiş olduğu anlamına gelir. Yalnızca java.lang.String alanları aranabilir yapılabilir. Bir alan yeni aranabilir hale getirildiğinde, veriler aranabilir hale gelmeden önce dizinlerin güncelleştirilmesi gerektiğini unutmayın. (Automatic Translation)
custom-field-key-help=Özel alan anahtarı alana programlı olarak &lt;liferay-ui:custom-öznitelik /&gt; etiketi üzerinden erişmek için kullanılır. (Automatic Translation)
custom-field-localize-field-name-help=Yerelleştirilebilir alan adına özel bir alan ayarlamak, alanın adının dil özellikleri dosyasında tanımlanan dil tuşlarına göre yerelleştireceği anlamına gelir. Varsayılan dil anahtarlarını geçersiz kılmak için belgelere bakın. (Automatic Translation)
custom-field-precision-help=Hassas, sayının uzunluğunu ayarlar. (Automatic Translation)
custom-field-secret-help=Özel bir alanı gizli olarak ayarlamak, yazmanın ekranda gizli olduğu anlamına gelir. Parolalar için bunu kullanın. (Automatic Translation)
custom-field-visible-with-update-permission-help=Güncelleştirme izniyle görünür özel bir alan ayarlamak, güncelleştirme izni olan bir kullanıcının bu alanı görüntüleyebileceği anlamına gelir. Bu ayar, bu durumda gizli değerini geçersiz kılar. (Automatic Translation)
