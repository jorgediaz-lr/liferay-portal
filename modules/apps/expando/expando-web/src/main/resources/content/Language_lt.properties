custom-field-secret-help=Pasirinktinio lauko nustatymas kaip slaptos reiškia, kad ekrane paslėptas įvedimas. Naudokite tai slaptažodžiams. (Automatic Translation)
custom-field-visible-with-update-permission-help=Pasirinktinio lauko nustatymas, kad jis būtų matomas su naujinimo teisėmis, reiškia, kad vartotojas, turintis naujinimo teises, gali peržiūrėti šį lauką. Šis parametras perrašo šiuo atveju paslėptos reikšmės. (Automatic Translation)
