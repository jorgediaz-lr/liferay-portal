custom-field-hidden-help=Pasirinktinio lauko nustatymas paslėptu reiškia, kad lauko reikšmė niekada nerodoma jokioje vartotojo sąsajoje be šio. Tai leidžia lauką naudoti labiau neaiškiems ir pažangesniems tikslams, pvz., pasirinktinių teisių vietos rezervavimo ženklui. (Automatic Translation)
custom-field-index-type-help=Pasirinktinio lauko nustatymas kaip ieškomo reiškia, kad lauko reikšmė indeksuojama, kai objektas (pvz., Vartotojas) pakeičiamas. Galima ieškoti tik java.lang.String laukuose. Atkreipkite dėmesį, kad kai lauke yra naujai ieškoma, rodyklės turi būti atnaujintos prieš ieškant. (Automatic Translation)
custom-field-key-help=Pasirinktinio lauko raktas naudojamas norint pasiekti lauką programiškai per žymę &lt;liferay-ui:custom attribute /&gt; . (Automatic Translation)
custom-field-localize-field-name-help=Pasirinktinio lauko nustatymas lokalizuojamu lauko pavadinimu reiškia, kad lauko pavadinimas bus lokalizuotas pagal kalbos raktus, apibrėžtus kalbos ypatybių faile. Norėdami nepaisyti numatytųjų kalbos raktų, žr. (Automatic Translation)
