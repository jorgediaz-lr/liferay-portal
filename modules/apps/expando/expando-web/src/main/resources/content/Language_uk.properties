custom-field-display-type-help=Укажіть тип елемента керування, який використовується для настроювання цього поля. (Automatic Translation)
custom-field-height-help=Це встановлює висоту поля введення у пікселях. (Automatic Translation)
custom-field-hidden-help=Встановлення нетипового поля на приховане означає, що значення поля ніколи не відображається в жодному інтерфейсі користувача, крім цього. Це дає змогу використовувати поле для більш незрозумілих і розширених цілей, таких як використання в якості покажчика місця заповнення для настроюваних дозволів. (Automatic Translation)
custom-field-index-type-help=Встановлення настроюваного поля для пошуку означає, що значення поля індексується під час змінення сутності (наприклад, User). Тільки поля java.lang.String можуть бути зроблені для пошуку. Зверніть увагу, що коли поле щойно створене для пошуку, індекси потрібно оновити, перш ніж дані будуть доступні для пошуку. (Automatic Translation)
custom-field-key-help=Ключ настроюваного поля використовується для доступу до поля програмним способом за допомогою мітки &lt;liferay-ui:custom-attribute /&gt;. (Automatic Translation)
custom-field-localize-field-name-help=Встановлення настроюваного поля на локалізоване ім'я поля означає, що ім'я поля буде локалізовано відповідно до мовних ключів, визначених у файлі властивостей мови. Зверніться до документації, щоб перевизначити мовні ключі за промовчанням. (Automatic Translation)
custom-field-precision-help=Точність встановлює довжину числа. (Automatic Translation)
custom-field-secret-help=Встановлення настроюваного поля на секретне означає, що введення тексту приховано на екрані. Використовуйте це для паролів. (Automatic Translation)
custom-field-visible-with-update-permission-help=Установлення настроюваного поля видимим із дозволом на оновлення означає, що користувач із дозволом на оновлення може переглядати це поле. Цей параметр має перевизначення значення прихованих у цьому випадку. (Automatic Translation)
custom-fields-are-not-enabled-for-any-resource=Настроювані поля не ввімкнуто для будь-якого ресурсу. (Automatic Translation)
