asset-list-configuration-name=Σύνολα περιεχομένου (Automatic Translation)
combine-assets-from-all-segments-in-asset-publisher-dynamic=Συνδυασμός στοιχείων από όλα τα τμήματα στον εκδότη περιουσιακών στοιχείων για δυναμικά σύνολα περιεχομένου (Automatic Translation)
combine-assets-from-all-segments-in-asset-publisher-dynamic-description=Ο Asset Publisher που έχει ρυθμιστεί σε μια λειτουργία δυναμικού συνόλου περιεχομένου θα συνδυάσει καταχωρήσεις συνόλου περιεχομένου από όλα τα τμήματα που αντιστοιχούν στον τρέχοντα χρήστη, όχι μόνο από το πιο σχετικό όπως είναι από προεπιλογή. Η ρύθμιση αυτή της τιμής true μπορεί να προκαλέσει την εμφάνιση καθυστερημένης απόκρισης από τον Εκδότη στοιχείων κατά την εμφάνιση στοιχείων για ένα χρήστη που ανήκει σε πολλά τμήματα αγοράς. (Automatic Translation)
combine-assets-from-all-segments-in-asset-publisher-manual=Συνδυασμός παγίων από όλα τα τμήματα στον εκδότη παγίων για μη αυτόματα σύνολα περιεχομένου (Automatic Translation)
combine-assets-from-all-segments-in-asset-publisher-manual-description=Ο Asset Publisher που έχει ρυθμιστεί σε μη αυτόματη λειτουργία συνόλου περιεχομένου θα συνδυάζει καταχωρήσεις συνόλου περιεχομένου από όλα τα τμήματα που αντιστοιχούν στον τρέχοντα χρήστη, όχι μόνο από το πιο σχετικό όπως είναι από προεπιλογή. (Automatic Translation)