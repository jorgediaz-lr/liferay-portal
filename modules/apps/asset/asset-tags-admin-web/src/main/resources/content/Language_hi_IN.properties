javax.portlet.description.com_liferay_asset_tags_admin_web_portlet_AssetTagsAdminPortlet=टैग शब्दों और पूर्व निर्धारित शब्दावली के लचीले समूहों के माध्यम से सामग्री का वर्गीकरण सक्षम करते हैं। प्रशासक सभी टैग का प्रबंधन कर सकते हैं, अनुमतियां आवंटित कर सकते हैं, और उन्नत विकल्प सेट कर सकते हैं। उपयोगकर्ता अपने टैग का प्रबंधन कर सकते हैं, और सामग्री को वर्गीकृत करते समय उपयोग करने के लिए टैग सेट और श्रेणियों को परिभाषित कर सकते हैं। (Automatic Translation)
