frontend-js-jquery-description=Η ενεργοποίηση του JQuery θα καταστήσει τη βιβλιοθήκη διαθέσιμη στο καθολικό αντικείμενο ως window.$ καθώς και AUI.$ μέσα στο χώρο ονομάτων CoaritUI. Ενεργοποιήστε αυτήν τη ρύθμιση, εάν βασίζεστε στην καθολική παρουσία της βιβλιοθήκης ή στην επισύναψή της στο αντικείμενο AUI. Για να εφαρμοστούν οι αλλαγές που γίνονται εδώ, πρέπει να φορτώσετε ξανά τη σελίδα του προγράμματος περιήγησης μετά την αποθήκευση. (Automatic Translation)