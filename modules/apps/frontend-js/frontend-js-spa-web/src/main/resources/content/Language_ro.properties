cache-expiration-time-description=Definiți ora, în minute, în care memoria cache SPA este eliminată. Utilizați o valoare zero dacă memoria cache nu ar trebui să expire în timpul navigării SPA. Utilizați o valoare negativă dacă memoria cache trebuie dezactivată. (Automatic Translation)
cache-expiration-time-name=Timp de expirare cache (Automatic Translation)
custom-excluded-paths-description=Define the custom paths that SPA should ignore. (Automatic Copy)
custom-excluded-paths-name=Custom Excluded Paths (Automatic Copy)
disable-in-internet-explorer=Dezactivarea SPA în Internet Explorer (Automatic Translation)
disable-in-internet-explorer-11=Dezactivarea SPA în Internet Explorer 11 (Automatic Translation)
disable-in-internet-explorer-11-description=Datorită unei erori în motorul de randare Trident (utilizat de IE11), atunci când SPA este utilizat pentru navigarea pe pagină, interogările media vor fi întotdeauna aplicate atunci când sunt specificate numai interogările cu lățime minimă sau numai cu lățime maximă, chiar dacă lățimea paginii nu se potrivește cu aceste interogări. Acest lucru afectează, de asemenea, iframe-uri terțe de pe pagină. Dezactivați SPA pentru a rezolva această problemă. (Automatic Translation)
disable-in-internet-explorer-description=Pentru a rezolva o eroare în motorul de randare Trident (utilizat de IE11) și motorul de randare MSHTML (utilizat de Edge), redarea corectă a paginii cu SPA necesită în prezent re-descărcarea tuturor fișierelor CSS pe toate navigarele de pagină pentru toate browserele Internet Explorer, ceea ce poate determina încărcarea mai lentă a paginilor cu SPA activat decât cu SPA dezactivat. Dezactivați SPA pentru a rezolva această problemă. (Automatic Translation)
it-looks-like-this-is-taking-longer-than-expected=Se pare că durează mai mult decât mă așteptam. (Automatic Translation)
navigation-exception-selectors-description=Definiți selectorii CSS pe care SPA ar trebui să-i ignore. (Automatic Translation)
navigation-exception-selectors-name=Selectori de excepții de navigare (Automatic Translation)
oops=Oops (Automatic Translation)
request-timeout-description=Definiți timpul, în milisecunde, în care o solicitare SPA se de expirare. Utilizați o valoare zero dacă solicitarea nu ar trebui să expirarea. (Automatic Translation)
request-timeout-name=Timp de expirare solicitare (Automatic Translation)
spa-configuration-description=Pentru ca modificările efectuate aici să aibă efect, trebuie să reîncărcați pagina browserului după salvare. (Automatic Translation)
spa-configuration-name=Infrastructura FRONTEND SPA (Automatic Translation)
the-spa-navigation-request-received-an-invalid-http-status-code=Solicitarea de navigare SPA a primit un cod de stare HTTP nevalid. (Automatic Translation)
the-spa-request-timed-out=Cererea SPA a fost dată în pauză. (Automatic Translation)
there-was-an-unexpected-error-in-the-spa-request=Eroare neașteptată în solicitarea SPA. (Automatic Translation)
user-notification-timeout-description=Definiți timpul, în milisecunde, în care o notificare este afișată utilizatorului care să ateste că solicitarea durează mai mult decât se aștepta. Utilizați o valoare zero dacă nu se afișează nicio notificare. (Automatic Translation)
user-notification-timeout-name=Expirare notificare utilizator (Automatic Translation)