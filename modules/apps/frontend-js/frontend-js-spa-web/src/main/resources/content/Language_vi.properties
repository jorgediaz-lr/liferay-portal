cache-expiration-time-description=Xác định thời gian, trong vài phút, trong đó bộ nhớ cache SPA bị xóa. Sử dụng một giá trị bằng không nếu bộ nhớ cache sẽ không bao giờ hết hạn trong quá trình điều hướng SPA. Sử dụng một giá trị tiêu cực nếu bộ nhớ cache sẽ bị vô hiệu hóa. (Automatic Translation)
cache-expiration-time-name=Thời gian hết hạn bộ nhớ cache (Automatic Translation)
disable-in-internet-explorer=Vô hiệu hóa SPA trong Internet Explorer (Automatic Translation)
disable-in-internet-explorer-11=Vô hiệu hóa SPA trong Internet Explorer 11 (Automatic Translation)
disable-in-internet-explorer-11-description=Do một lỗi trong công cụ kết xuất Trident (được sử dụng bởi IE11), khi SPA được sử dụng để điều hướng trang, truy vấn phương tiện sẽ luôn được áp dụng khi chỉ có chiều rộng tối thiểu hoặc chỉ truy vấn chiều rộng tối đa được chỉ định, ngay cả khi chiều rộng trang không khớp với các truy vấn đó. Điều này cũng ảnh hưởng đến iframe của bên thứ ba trên trang. Vô hiệu hoá SPA để làm việc xung quanh vấn đề này. (Automatic Translation)
disable-in-internet-explorer-description=Để làm việc xung quanh một lỗi trong công cụ rendering Trident (được sử dụng bởi IE11) và MSHTML rendering engine (được sử dụng bởi Edge), đúng rendering trang với SPA hiện nay yêu cầu tái tải về tất cả các tập tin CSS trên tất cả các chuyển hướng trang cho tất cả các trình duyệt Internet Explorer, mà có thể gây ra các trang để tải chậm hơn với SPA kích hoạt hơn với SPA vô hiệu hóa. Vô hiệu hoá SPA để làm việc xung quanh vấn đề này. (Automatic Translation)
it-looks-like-this-is-taking-longer-than-expected=Có vẻ như việc này mất nhiều thời gian hơn dự kiến. (Automatic Translation)
navigation-exception-selectors-description=Xác định bộ chọn CSS mà SPA nên bỏ qua. (Automatic Translation)
navigation-exception-selectors-name=Bộ chọn Ngoại lệ Dẫn hướng (Automatic Translation)
oops=Rất tiếc (Automatic Translation)
request-timeout-description=Xác định thời gian, tính bằng mili giây, trong đó yêu cầu SPA hết thời gian. Sử dụng giá trị bằng không nếu yêu cầu không bao giờ nên thời gian chờ. (Automatic Translation)
request-timeout-name=Yêu cầu Thời gian chờ (Automatic Translation)
spa-configuration-description=Để thay đổi được thực hiện ở đây có hiệu lực, bạn phải tải lại trang trình duyệt sau khi lưu. (Automatic Translation)
spa-configuration-name=Cơ sở hạ tầng SPA lối vào (Automatic Translation)
the-spa-navigation-request-received-an-invalid-http-status-code=Yêu cầu dẫn hướng SPA đã nhận được mã trạng thái HTTP không hợp lệ. (Automatic Translation)
the-spa-request-timed-out=Yêu cầu SPA đã hết thời gian. (Automatic Translation)
there-was-an-unexpected-error-in-the-spa-request=Đã xảy ra lỗi không mong muốn trong yêu cầu SPA. (Automatic Translation)
user-notification-timeout-description=Xác định thời gian, tính bằng mili giây, trong đó thông báo được hiển thị cho người dùng nói rằng yêu cầu mất nhiều thời gian hơn dự kiến. Sử dụng giá trị bằng không nếu không có thông báo nào được hiển thị. (Automatic Translation)
user-notification-timeout-name=Thời gian chờ Thông báo Người dùng (Automatic Translation)