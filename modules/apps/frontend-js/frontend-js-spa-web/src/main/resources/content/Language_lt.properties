disable-in-internet-explorer-11-description=Dėl trident atvaizdavimo modulio (naudojamo IE11) klaidos, kai SPA naudojamas puslapių naršymui, medijos užklausos visada bus taikomos, kai nurodomos tik min pločio arba tik maksimalaus pločio užklausos, net jei puslapio plotis neatitinka šių užklausų. Tai taip pat turi įtakos trečiųjų šalių "iframe" puslapyje. Išjunkite SPA, kad išspręsti šią problemą. (Automatic Translation)
disable-in-internet-explorer-description=Siekiant išspręsti trident atvaizdavimo variklio (naudojamas IE11) ir MSHTML atvaizdavimo variklio (naudojamas Edge) klaidą, tinkamai atvaizduoti puslapį su SPA šiuo metu reikia iš naujo atsisiųsti visus CSS failus į visus puslapio naršymo visų "Internet Explorer" naršyklių, kurios gali sukelti puslapių apkrova lėčiau su SPA įjungtas nei SU SPA išjungtas. Išjunkite SPA, kad išspręsti šią problemą. (Automatic Translation)
