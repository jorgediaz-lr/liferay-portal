cache-expiration-time-description=Nustatykite laiką minutėmis, kai IŠvaloma SPA talpykla. Naudokite nulinę reikšmę, jei talpyklos galiojimo laikas niekada neturėtų baigtis SPA naršymo metu. Naudokite neigiamą reikšmę, jei talpykla turi būti išjungta. (Automatic Translation)
