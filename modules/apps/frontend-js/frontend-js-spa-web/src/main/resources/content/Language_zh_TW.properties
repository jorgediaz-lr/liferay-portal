cache-expiration-time-description=定義清除 SPA 快取的時間(以分鐘)。如果緩存在 SPA 導航期間永遠不會過期,請使用零值。如果應禁用緩存,請使用負值。 (Automatic Translation)
cache-expiration-time-name=Cache 過期時間
custom-excluded-paths-description=Define the custom paths that SPA should ignore. (Automatic Copy)
custom-excluded-paths-name=Custom Excluded Paths (Automatic Copy)
disable-in-internet-explorer=在 Internet 資源管理器中禁用 SPA (Automatic Translation)
disable-in-internet-explorer-11=在 Internet 資源管理員 11 中禁用 SPA (Automatic Translation)
disable-in-internet-explorer-11-description=由於 Trident 呈現引擎中的 Bug(由 IE11 使用),當 SPA 用於頁面導航時,即使頁面寬度與這些查詢不匹配,也始終在指定最小寬度或僅指定最大寬度查詢時應用媒體查詢。這也會影響頁面上的第三方 iframe。禁用 SPA 以解決此問題。 (Automatic Translation)
disable-in-internet-explorer-description=為了解決 Trident 呈現引擎(由 IE11 使用)和 MSHTML 呈現引擎(Edge 使用)中的 Bug,目前需要重新下載所有 Internet Explorer 瀏覽器的所有頁面導航上的所有 CSS 檔,這可能會導致啟用了 SPA 的頁面載入速度比禁用 SPA 慢。禁用 SPA 以解決此問題。 (Automatic Translation)
it-looks-like-this-is-taking-longer-than-expected=看起來這需要比預期更長的時間。
navigation-exception-selectors-description=定義 SPA 應該忽略的 CSS 選擇器。
navigation-exception-selectors-name=導航例外選擇器
oops=Oops
request-timeout-description=以毫秒為單位，定義 SPA 請求逾時的時間。如果請求永遠不會逾時，則使用零值。
request-timeout-name=請求逾時時間
spa-configuration-description=要使此處所做的更改生效，您必須在儲存後重新載入瀏覽器頁面。
spa-configuration-name=前端 SPA 架構
the-spa-navigation-request-received-an-invalid-http-status-code=SPA 導航請求收到無效 HTTP 狀態碼。
the-spa-request-timed-out=SPA 請求逾時。
there-was-an-unexpected-error-in-the-spa-request=SPA 請求中發生非預期的錯誤。
user-notification-timeout-description=以毫秒為單位定義向使用者顯示通知的時長，表明請求比預期的長。如果不顯示通知，請使用零值。
user-notification-timeout-name=使用者通知逾時