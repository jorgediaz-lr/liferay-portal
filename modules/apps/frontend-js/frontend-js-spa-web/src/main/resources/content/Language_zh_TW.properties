cache-expiration-time-description=定義清除 SPA 快取的時間(以分鐘)。如果緩存在 SPA 導航期間永遠不會過期,請使用零值。如果應禁用緩存,請使用負值。 (Automatic Translation)
cache-expiration-time-name=緩存過期時間 (Automatic Translation)
disable-in-internet-explorer=在 Internet 資源管理器中禁用 SPA (Automatic Translation)
disable-in-internet-explorer-11=在 Internet 資源管理員 11 中禁用 SPA (Automatic Translation)
disable-in-internet-explorer-11-description=由於 Trident 呈現引擎中的 Bug(由 IE11 使用),當 SPA 用於頁面導航時,即使頁面寬度與這些查詢不匹配,也始終在指定最小寬度或僅指定最大寬度查詢時應用媒體查詢。這也會影響頁面上的第三方 iframe。禁用 SPA 以解決此問題。 (Automatic Translation)
disable-in-internet-explorer-description=為了解決 Trident 呈現引擎(由 IE11 使用)和 MSHTML 呈現引擎(Edge 使用)中的 Bug,目前需要重新下載所有 Internet Explorer 瀏覽器的所有頁面導航上的所有 CSS 檔,這可能會導致啟用了 SPA 的頁面載入速度比禁用 SPA 慢。禁用 SPA 以解決此問題。 (Automatic Translation)
it-looks-like-this-is-taking-longer-than-expected=看起來這需要更長的時間比預期。 (Automatic Translation)
navigation-exception-selectors-description=定義 SPA 應忽略的 CSS 選擇器。 (Automatic Translation)
navigation-exception-selectors-name=導航異常選擇器 (Automatic Translation)
oops=哎呀 (Automatic Translation)
request-timeout-description=定義 SPA 請求在其中分時的時間(以毫秒為單位)。如果請求不應超時,請使用零值。 (Automatic Translation)
request-timeout-name=請求超時時間 (Automatic Translation)
spa-configuration-description=若要在此所做的更改生效,您必須在儲存後重新載入瀏覽器頁面。 (Automatic Translation)
spa-configuration-name=前端 SPA 基礎設施 (Automatic Translation)
the-spa-navigation-request-received-an-invalid-http-status-code=SPA 導航請求收到無效的 HTTP 狀態代碼。 (Automatic Translation)
the-spa-request-timed-out=SPA 請求已發出時間。 (Automatic Translation)
there-was-an-unexpected-error-in-the-spa-request=SPA 請求中出現意外錯誤。 (Automatic Translation)
user-notification-timeout-description=定義向使用者顯示通知的時間(毫秒),說明請求所用的時間比預期要長。如果不應顯示任何通知,請使用零值。 (Automatic Translation)
user-notification-timeout-name=使用者通知超時 (Automatic Translation)