cache-expiration-time-description=Definujte čas v minutách, ve kterém je vymažena mezipaměť SPA. Pokud by během navigace spa nikdy nevypršel platnost mezipaměti, použijte nulovou hodnotu. Pokud by měla být zakázána mezipaměť, použijte zápornou hodnotu. (Automatic Translation)
cache-expiration-time-name=Doba vypršení platnosti mezipaměti (Automatic Translation)
disable-in-internet-explorer=Zakázání služby SPA v aplikaci Internet Explorer (Automatic Translation)
disable-in-internet-explorer-11=Zakázání služby SPA v aplikaci Internet Explorer 11 (Automatic Translation)
disable-in-internet-explorer-11-description=Z důvodu chyby v vykreslovacím modulu Trident (používaném IE11), když se spa používá pro navigaci na stránce, budou dotazy na média vždy použity, pokud jsou zadány pouze dotazy s minimální šířkou nebo pouze s maximální šířkou, a to i v případě, že šířka stránky neodpovídá těmto dotazům. To se týká také iframe třetích stran na stránce. Zakázat SPA tento problém vyřešit. (Automatic Translation)
disable-in-internet-explorer-description=Aby bylo možné obejít chybu v vykreslovacím modulu Trident (používaném IE11) a vykreslovacím enginem MSHTML (používaný edgem), správné vykreslování stránky se spa v současné době vyžaduje opětovné stažení všech souborů CSS na všech navigačních stránkách pro všechny prohlížeče Internet Explorer, což může způsobit, že se stránky načítají pomaleji s povoleným SPA než se zakázaným spa. Zakázat SPA tento problém vyřešit. (Automatic Translation)
it-looks-like-this-is-taking-longer-than-expected=Vypadá to, že to trvá déle, než se očekávalo. (Automatic Translation)
navigation-exception-selectors-description=Definujte voliče CSS, které by spa měl ignorovat. (Automatic Translation)
navigation-exception-selectors-name=Selektory výjimek navigace (Automatic Translation)
oops=Jejda (Automatic Translation)
request-timeout-description=Definujte čas v milisekundách, ve kterém vypršel časový počet požadavků spa. Pokud by požadavek nikdy neměl časový časovývý soubor, použijte nulovou hodnotu. (Automatic Translation)
request-timeout-name=Čas vypršel požadavek (Automatic Translation)
spa-configuration-description=Aby se změny, které se zde projeví, načtete po uložení znovu. (Automatic Translation)
spa-configuration-name=Frontend SPA infrastruktury (Automatic Translation)
the-spa-navigation-request-received-an-invalid-http-status-code=Požadavek na navigaci spa obdržel neplatný stavový kód HTTP. (Automatic Translation)
the-spa-request-timed-out=Vypršel časový počet požadavků spa. (Automatic Translation)
there-was-an-unexpected-error-in-the-spa-request=V požadavku spa došlo k neočekávané chybě. (Automatic Translation)
user-notification-timeout-description=Definujte čas v milisekundách, ve kterém je uživateli zobrazeno oznámení o tom, že požadavek trvá déle, než bylo očekáváno. Pokud by se nemělo zobrazit žádné oznámení, použijte nulovou hodnotu. (Automatic Translation)
user-notification-timeout-name=Časový protivýužek oznámení uživatele (Automatic Translation)