cache-expiration-time-description=Ορίστε την ώρα, σε λεπτά, κατά την οποία καταργείται η εκκαθάριση της μνήμης cache SPA. Χρησιμοποιήστε μια μηδενική τιμή, εάν η μνήμη cache δεν πρέπει ποτέ να λήξει κατά την περιήγηση SPA. Χρησιμοποιήστε μια αρνητική τιμή, εάν η μνήμη cache πρέπει να απενεργοποιηθεί. (Automatic Translation)
cache-expiration-time-name=Χρόνος λήξης cache (Automatic Translation)
custom-excluded-paths-description=Define the custom paths that SPA should ignore. (Automatic Copy)
custom-excluded-paths-name=Custom Excluded Paths (Automatic Copy)
disable-in-internet-explorer=Απενεργοποίηση SPA στον Internet Explorer (Automatic Translation)
disable-in-internet-explorer-11=Απενεργοποίηση SPA στον Internet Explorer 11 (Automatic Translation)
disable-in-internet-explorer-11-description=Λόγω ενός σφάλματος στη μηχανή απόδοσης Trident (που χρησιμοποιείται από IE11), όταν το SPA χρησιμοποιείται για πλοήγηση στη σελίδα, τα ερωτήματα πολυμέσων θα εφαρμόζονται πάντα όταν καθορίζονται μόνο ερωτήματα ελάχιστου πλάτους ή μόνο μέγιστου πλάτους, ακόμα και αν το πλάτος της σελίδας δεν ταιριάζει με αυτά τα ερωτήματα. Αυτό επηρεάζει επίσης τα iframe άλλων κατασκευαστών στη σελίδα. Απενεργοποιήστε το SPA για να επιλύσετε αυτό το ζήτημα. (Automatic Translation)
disable-in-internet-explorer-description=Προκειμένου να εργαστεί γύρω από ένα ζωύφιο στη μηχανή απόδοσης Trident (που χρησιμοποιείται από IE11) και τη μηχανή απόδοσης MSHTML (που χρησιμοποιείται από την άκρη), η σωστή απόδοση της σελίδας με το SPA απαιτεί αυτήν την περίοδο την εκ νέου μεταφόρτωση όλων των αρχείων CSS σε όλες τις πλοηγήσεις σελίδων για όλα τα προγράμματα περιήγησης εξερευνητών Διαδικτύου, τα οποία μπορούν να προκαλέσουν τις σελίδες για να φορτώσουν πιό αργά με spa ενεργοποιημένο απ'ό, τι με spa που είναι απενεργοποιημένη. Απενεργοποιήστε το SPA για να επιλύσετε αυτό το ζήτημα. (Automatic Translation)
it-looks-like-this-is-taking-longer-than-expected=Φαίνεται ότι αυτό διαρκεί περισσότερο από το αναμενόμενο. (Automatic Translation)
navigation-exception-selectors-description=Ορίστε τους επιλογείς CSS που πρέπει να αγνοήσει η SPA. (Automatic Translation)
navigation-exception-selectors-name=Επιλογείς εξαιρέσεων περιήγησης (Automatic Translation)
oops=Ωχ (Automatic Translation)
request-timeout-description=Ορίστε το χρόνο, σε χιλιοστά του δευτερολέπτου, κατά την οποία ορίζεται το χρονικό διάστημα της αίτησης SPA. Χρησιμοποιήστε μια μηδενική τιμή, εάν η αίτηση δεν πρέπει ποτέ να λήξει το χρονικό όριο. (Automatic Translation)
request-timeout-name=Χρόνος χρονικού ορίου αίτησης (Automatic Translation)
spa-configuration-description=Για να εφαρμοστούν οι αλλαγές που γίνονται εδώ, πρέπει να φορτώσετε ξανά τη σελίδα του προγράμματος περιήγησης μετά την αποθήκευση. (Automatic Translation)
spa-configuration-name=Υποδομή SPA frontend (Automatic Translation)
the-spa-navigation-request-received-an-invalid-http-status-code=Η αίτηση περιήγησης SPA έλαβε έναν μη έγκυρο κωδικό κατάστασης HTTP. (Automatic Translation)
the-spa-request-timed-out=Ή χρονικά πίσω εί παρά το χρονικό 100. (Automatic Translation)
there-was-an-unexpected-error-in-the-spa-request=Παρουσιάστηκε ένα μη αναμενόμενο σφάλμα στην αίτηση SPA. (Automatic Translation)
user-notification-timeout-description=Ορίστε το χρόνο, σε χιλιοστά του δευτερολέπτου, κατά την οποία εμφανίζεται μια ειδοποίηση στο χρήστη που δηλώνει ότι η αίτηση διαρκεί περισσότερο από το αναμενόμενο. Χρησιμοποιήστε μηδενική τιμή, εάν δεν πρέπει να εμφανίζεται καμία ειδοποίηση. (Automatic Translation)
user-notification-timeout-name=Χρονικό όριο ειδοποίησης χρήστη (Automatic Translation)