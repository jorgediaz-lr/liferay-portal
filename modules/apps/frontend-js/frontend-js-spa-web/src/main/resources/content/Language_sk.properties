cache-expiration-time-description=Definujte čas, v minútach, v ktorom spa cache je vymazaný. Použite nulovú hodnotu, ak vyrovnávacia pamäť by nikdy nemala vypršať počas navigácie SPA. Ak chcete vypnúť vyrovnávaciu pamäť, použite zápornú hodnotu. (Automatic Translation)
cache-expiration-time-name=Čas uplynutia platnosti vyrovnávacej pamäte (Automatic Translation)
disable-in-internet-explorer=Zakázať SPA v programe Internet Explorer (Automatic Translation)
disable-in-internet-explorer-11=Zakázať SPA v Internet Exploreri 11 (Automatic Translation)
disable-in-internet-explorer-11-description=Kvôli chybe v nástroji na vykresľovanie Trident (používaným spoločnosťou IE11), keď sa SPA používa na navigáciu na stránke, mediálne dotazy sa vždy použijú, keď sú zadané iba otázky s min-šírkou alebo len s maximálnou šírkou, a to aj v prípade, že šírka stránky sa nezhoduje s týmito dotazmi. Týka sa to aj iframe tretích strán na stránke. Zakázať SPA obísť tento problém. (Automatic Translation)
disable-in-internet-explorer-description=Aby bolo možné obísť chybu v trident vykresľovanie motora (používa IE11) a MSHTML rendering engine (používa Edge), správne vykresľovanie stránky s SPA v súčasnosti vyžaduje re-sťahovanie všetkých CSS súborov na všetkých stránkach navigácia pre všetky prehliadače Internet Explorer, čo môže spôsobiť stránky načítať pomalšie s SPA povolené ako s SPA zdravotne postihnutých. Zakázať SPA obísť tento problém. (Automatic Translation)
it-looks-like-this-is-taking-longer-than-expected=Vyzerá to, že to trvá dlhšie, než sa očakávalo. (Automatic Translation)
navigation-exception-selectors-description=Definujte css selektory, ktoré spa by mal ignorovať. (Automatic Translation)
navigation-exception-selectors-name=Selektory výnimiek navigácie (Automatic Translation)
oops=Jejda (Automatic Translation)
request-timeout-description=Definujte čas v milisekundách, v ktorom časový čas požiadavky SPA. Ak by požiadavka nikdy nemala časový limit, použite nulovú hodnotu. (Automatic Translation)
request-timeout-name=Časový limit požiadavky (Automatic Translation)
spa-configuration-description=Zmeny vykonané tu sa prejavia, musíte po uložení znova načítať stránku prehliadača. (Automatic Translation)
spa-configuration-name=Infraštruktúra frontend SPA (Automatic Translation)
the-spa-navigation-request-received-an-invalid-http-status-code=Spa navigácia žiadosť dostala neplatný kód stavu HTTP. (Automatic Translation)
the-spa-request-timed-out=Časový čas žiadosti SPA vyšiel. (Automatic Translation)
there-was-an-unexpected-error-in-the-spa-request=V požiadavke SPA sa vyskytla neočakávaná chyba. (Automatic Translation)
user-notification-timeout-description=Definujte čas v milisekundách, v ktorom sa používateľovi zobrazí upozornenie, v ktorom sa uvádza, že požiadavka trvá dlhšie, než sa očakávalo. Ak sa nemá zobraziť žiadne upozornenie, použite nulovú hodnotu. (Automatic Translation)
user-notification-timeout-name=Časový limit upozornenia používateľa (Automatic Translation)