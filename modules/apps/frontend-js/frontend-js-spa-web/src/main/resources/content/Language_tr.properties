user-notification-timeout-description=İsteğin beklenenden uzun sürdüğünü belirten bir bildirimin kullanıcıya gösterildiği milisaniye cinsinden saati tanımlayın. Bildirim gösterilmeyecekse sıfır değeri kullanın. (Automatic Translation)
