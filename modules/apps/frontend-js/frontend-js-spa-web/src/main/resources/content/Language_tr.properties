cache-expiration-time-description=SPA önbelleğinin temizlendiği saati dakikalar içinde tanımlayın. SPA gezintisi sırasında önbelleğin süresi hiç dolmayacaksa sıfır değeri kullanın. Önbellek devre dışı bırakılırsa negatif bir değer kullanın. (Automatic Translation)
cache-expiration-time-name=Önbellek Son Kullanma Süresi (Automatic Translation)
disable-in-internet-explorer=Internet Explorer'da SPA'yı devre dışı (Automatic Translation)
disable-in-internet-explorer-11=Internet Explorer 11'de SPA'yı devre dışı (Automatic Translation)
disable-in-internet-explorer-11-description=Sayfa genişliği bu sorgularla eşleşmese bile, Sayfa genişliği yalnızca min genişliğinde veya yalnızca maksimum genişliksorguları belirtildiğinde, Sayfa gezintisi için SPA kullanıldığında, Trident işleme motorundaki (IE11 tarafından kullanılan) bir hata nedeniyle ortam sorguları her zaman uygulanır. Bu, sayfadaki üçüncü taraf iframe'leri de etkiler. Spa'yı bu sorunu çözmek için devre dışı kılmış olur. (Automatic Translation)
disable-in-internet-explorer-description=Trident render motoru (IE11 tarafından kullanılan) ve MSHTML render motoru (Edge tarafından kullanılan) bir hata etrafında çalışmak için, düzgün SPA ile sayfa render şu anda tüm Internet Explorer tarayıcıları için tüm sayfa navigasyonları tüm CSS dosyaları yeniden indirme gerektirir, hangi spa ile daha yavaş yüklemek için neden olabilir SPA devre dışı. Spa'yı bu sorunu çözmek için devre dışı kılmış olur. (Automatic Translation)
it-looks-like-this-is-taking-longer-than-expected=Bu beklenenden daha uzun sürüyor gibi görünüyor. (Automatic Translation)
navigation-exception-selectors-description=SPA'nın göz ardı etmesi gereken CSS seçicilerini tanımlayın. (Automatic Translation)
navigation-exception-selectors-name=Navigasyon Özel Durum Seçicileri (Automatic Translation)
oops=Oops (Automatic Translation)
request-timeout-description=SPA isteğinin zaman dolduğu zamanı milisaniye cinsinden tanımlayın. İstek hiçbir zaman zaman alamaması gerekiyorsa sıfır değeri kullanın. (Automatic Translation)
request-timeout-name=Zaman Ara Süresi İsteyin (Automatic Translation)
spa-configuration-description=Burada yapılan değişikliklerin etkili olması için, kaydetme den sonra tarayıcı sayfasını yeniden yüklemeniz gerekir. (Automatic Translation)
spa-configuration-name=Frontend SPA Altyapısı (Automatic Translation)
