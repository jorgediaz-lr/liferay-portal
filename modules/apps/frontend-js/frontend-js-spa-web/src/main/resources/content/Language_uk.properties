cache-expiration-time-description=Визначте час, у хвилинах, в яких очищено кеш SPA. Використовуйте нульове значення, якщо кеш ніколи не закінчується під Вільний час SPA навігації. Використовуйте від'ємне значення, якщо кеш слід вимкнути. (Automatic Translation)
cache-expiration-time-name=Час завершення терміну дії кешу (Automatic Translation)
disable-in-internet-explorer=Вимкнення спа-центру у браузері Internet Explorer (Automatic Translation)
disable-in-internet-explorer-11=Вимкнення SPA у браузері Internet Explorer, 11 (Automatic Translation)
disable-in-internet-explorer-11-description=Через помилку в обробника рендеринга Trident (використовується IE11), коли SPA використовується для навігації по сторінках, медіа-запити завжди застосовуватимуться, якщо вказано лише мінімальну ширину або лише запити максимальної ширини, навіть якщо ширина сторінки не відповідає цим запитам. Це також впливає на сторонніх iframes на сторінці. Вимкніть SPA, щоб вирішити цю проблему. (Automatic Translation)
disable-in-internet-explorer-description=Для того, щоб обійти помилку в обробника рендеринга Trident (використовується IE11) і рушієм рендеринга MSHTML (використовується Edge), належне відтворення сторінки з SPA в даний час вимагає повторного завантаження всіх файлів CSS на всіх навігаціях сторінок для всіх браузерів Internet Explorer, що може призвести до повільнішого завантаження сторінок за допомогою SPA, включеного, ніж з вимкненим SPA. Вимкніть SPA, щоб вирішити цю проблему. (Automatic Translation)
it-looks-like-this-is-taking-longer-than-expected=Схоже, це займає більше часу, ніж очікувалося. (Automatic Translation)
navigation-exception-selectors-description=Визначте селектори CSS, які SPA слід ігнорувати. (Automatic Translation)
navigation-exception-selectors-name=Селектори винятків навігації (Automatic Translation)
oops=Ой (Automatic Translation)
request-timeout-description=Визначте час у мілісекундах, в яких час очікування запиту SPA. Використовуйте нульове значення, якщо запит ніколи не повинен тайм-аут. (Automatic Translation)
request-timeout-name=Час очікування запиту (Automatic Translation)
spa-configuration-description=Щоб зміни, внесені тут, навчалися, потрібно перезавантажити сторінку браузера після збереження. (Automatic Translation)
spa-configuration-name=Frontend SPA інфраструктура (Automatic Translation)
the-spa-navigation-request-received-an-invalid-http-status-code=Запит навігації SPA отримав неприпустимий код стану HTTP. (Automatic Translation)
the-spa-request-timed-out=Тайм-аут запиту спа-центру минув. (Automatic Translation)
there-was-an-unexpected-error-in-the-spa-request=Сталася неочікувана помилка в запиті SPA. (Automatic Translation)
user-notification-timeout-description=Визначте час у мілісекундах, в якому користувачеві відображається сповіщення про те, що запит займає більше часу, ніж очікувалося. Використовуйте нульове значення, якщо сповіщення не повинно відображатися. (Automatic Translation)
user-notification-timeout-name=Тайм-аут сповіщень користувачів (Automatic Translation)