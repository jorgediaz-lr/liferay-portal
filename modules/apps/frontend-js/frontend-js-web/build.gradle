import com.liferay.gradle.util.FileUtil
import com.liferay.gradle.util.copy.StripPathSegmentsAction

ext {
	svg4EverybodyVersion = "8bd711049ba3faefb8285ca70c63a67efc35636c"

	svg4EverybodyURL = "https://raw.githubusercontent.com/jonathantneal/svg4everybody/${svg4EverybodyVersion}/lib/svg4everybody.js"
}

task buildClay(type: Copy)
task buildLiferayAMDLoader(type: Copy)
task buildLodash(type: Copy)
task downloadSvg4Everybody(type: Copy)

File jsDestinationDir = file("tmp/META-INF/resources")

buildClay {
	File clayDestinationDir = new File(jsDestinationDir, "clay")

	dependsOn npmInstall

	doFirst {
		delete clayDestinationDir
	}

	eachFile new StripPathSegmentsAction(3)

	from npmInstall.nodeModulesDir
	include "clay/lib/js/"
	includeEmptyDirs = false
	into clayDestinationDir
}

buildLiferayAMDLoader {
	dependsOn npmInstall
	eachFile new StripPathSegmentsAction(3)
	from npmInstall.nodeModulesDir

	include "liferay-amd-loader/build/loader/loader.js.map"
	include "liferay-amd-loader/build/loader/loader.js"

	includeEmptyDirs = false
	into new File(jsDestinationDir, "loader")
}

classes {
	dependsOn buildClay
	dependsOn buildLiferayAMDLoader
}

clean {
	delete "tmp"
}

dependencies {
	compileOnly group: "com.liferay.portal", name: "com.liferay.portal.impl", version: "default"
	compileOnly group: "com.liferay.portal", name: "com.liferay.portal.kernel", version: "default"
	compileOnly group: "com.liferay.portal", name: "com.liferay.util.taglib", version: "default"
	compileOnly group: "javax.portlet", name: "portlet-api", version: "3.0.1"
	compileOnly group: "javax.servlet.jsp", name: "javax.servlet.jsp-api", version: "2.3.1"
	compileOnly group: "org.apache.felix", name: "org.apache.felix.http.servlet-api", version: "1.1.2"
	compileOnly group: "org.osgi", name: "org.osgi.service.component.annotations", version: "1.3.0"
	compileOnly group: "org.osgi", name: "osgi.core", version: "6.0.0"
	compileOnly project(":apps:frontend-js:frontend-js-loader-modules-extender-api")
	compileOnly project(":core:osgi-service-tracker-collections")
	compileOnly project(":core:petra:petra-lang")
}

downloadSvg4Everybody {
	File svg4EverybodyURLFile = file("src/main/resources/META-INF/resources/misc/svg4everybody.js")

	ext {
		autoClean = false
	}

	filter {
		String line ->

		line.replace "function svg4everybody", "module.exports = function svg4everybody"
	}

	from {
		FileUtil.get(project, project.svg4EverybodyURL)
	}

	into svg4EverybodyURLFile.parentFile

	onlyIf {
		!svg4EverybodyURLFile.exists()
	}
}

processResources {
	dependsOn downloadSvg4Everybody
}