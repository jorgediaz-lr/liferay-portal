frontend-js-lodash-description=Η ενεργοποίηση του Lodash θα καταστήσει τη βιβλιοθήκη διαθέσιμη στο καθολικό αντικείμενο ως window._ καθώς και AUI._ μέσα στο χώρο ονομάτων AlloyUI. Ενεργοποιήστε αυτήν τη ρύθμιση, εάν βασίζεστε στην καθολική παρουσία της βιβλιοθήκης ή στην επισύναψή της στο αντικείμενο AUI. Για να εφαρμοστούν οι αλλαγές που γίνονται εδώ, πρέπει να φορτώσετε ξανά τη σελίδα του προγράμματος περιήγησης μετά την αποθήκευση. (Automatic Translation)