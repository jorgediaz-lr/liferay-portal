liferay-releng-app-description=Se recomienda usar la aplicación Web Content Display en lugar de la aplicación WYSIWYG. Aunque la aplicación WYSIWYG proporciona una forma rápida de crear y editar contenidos web, no proporcionar metadatos de seguimiento, como títulos, versiones o resúmenes. La aplicación Web Content Display proporciona todas estas características y más.