liferay-releng-app-description=Azt tanácsoljuk, hogy a WYSIWYG alkalmazás helyett használja a Web Content Display alkalmazást. Míg a WYSIWYG alkalmazás gyors módszert kínál webes tartalom létrehozására és szerkesztésére,, nem szolgáltat követési metaadatokat, például címeket, verziókat vagy kivonatokat. A Web Content Display alkalmazás mindezeken a lehetőségeken kívül még sok egyebet is kínál.