liferay-releng-app-description=Det rekommenderas att du använder Web Content Display-appen instället för WYSIWYG-appen. WYSIWYG-appen erbjuder ett snabbt sätt för att skapa och redigera webbinnehåll men spårar inte metadata som titlar, versioner eller sammanfattningar. Web Content Display-appen erbjuder dessa funktioner och mer.