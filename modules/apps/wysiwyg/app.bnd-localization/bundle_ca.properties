liferay-releng-app-description=Us recomanem que utilitzeu l'aplicació Web Content Display en comptes de l'aplicació WYSIWYG. Per bé que l'aplicació WYSIWYG proporcionava una manera ràpida de crear i editar contingut web, no proporcionava metadades de seguiment com ara títols, versions o resums. L'aplicació Web Content Display proporciona totes aquestes característiques i més.