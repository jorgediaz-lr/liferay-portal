liferay-releng-app-description=On suositeltavaa käyttää Web-sisällön näyttösovellusta WYSIWYG-sovelluksen sijaan. Vaikka WYSIWYG-sovellus tarjosi nopean tavan luoda ja muokata verkkosisältöä, se ei tarjonnut mitään seurannan metatietoja, kuten otsikoita, versioita tai tiivistelmiä. Web-sisällön näyttösovellus tarjoaa kaikki nämä ominaisuudet ja paljon muuta.