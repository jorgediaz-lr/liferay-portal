openoffice-server-enabled-help=Η ενεργοποίηση της ενσωμάτωσης του OpenOffice επιτρέπει στα Documents & Media και το Wiki να παρέχουν λειτουργίες μετατροπής. Αυτό ελέγχεται με το OpenOffice 4.1.x. Συνιστάται να έχετε το OpenOffice στον ίδιο υπολογιστή. Η χρήση ενός απομακρυσμένου κεντρικού υπολογιστή για την παρουσία δεν υποστηρίζεται πλήρως και θα μπορούσε να οδηγήσει σε διάφορα προβλήματα. Για να ξεκινήσετε το OpenOffice ως υπηρεσία, εκτελέστε την εντολή: soffice -headless -accept="socket,host=127.0.0.1,port=8100;urp;" (Automatic Translation)
