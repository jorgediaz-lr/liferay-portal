openoffice-server-enabled-help=Cho phép tích hợp OpenOffice cho phép Documents & Media và Wiki cung cấp chức năng chuyển đổi. Điều này được kiểm tra với OpenOffice 4.1.x. Đó là khuyến cáo rằng bạn có OpenOffice trên cùng một máy tính. Sử dụng một máy chủ từ xa cho trường hợp không được hỗ trợ đầy đủ và có thể dẫn đến các vấn đề khác nhau. Để bắt đầu OpenOffice dưới dạng dịch vụ, hãy chạy lệnh: soffice -headless -accept="socket,host=127.0.0.1,port=8100;urp;" (Automatic Translation)
