delete-depth-description=Установіть глибину зіставлених записів CMIS, які потрібно видалити, коли видалення називається з порталу. Тим глибше налаштування, тим більше дзвінків на сервер потрібно. Коли видалення називається за межами порталу, зіставлених CMIS запис А бізнес-партнера залишаються застій у базі даних. Очікувані значення: -1 для глибини, 0 для немає та 1 для неглибоких. (Automatic Translation)
