delete-depth-description=Saate seada vastendatud CMIS-kirjete sügavuse, et eemaldada, kui portaalist kutsutakse kustutamine. Mida sügavam seade, seda rohkem kõnesid server vaja. Kui kustutamine kutsutakse väljastpoolt portaali, jäävad vastendatud CMIS-kirjed andmebaasi stagnant. Eeldatavad väärtused on: -1 sügava, 0 mitte ühegi ja 1 madala. (Automatic Translation)
