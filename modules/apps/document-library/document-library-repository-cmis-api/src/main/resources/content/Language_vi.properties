cmis-repository-configuration-name=Kho CMIS (Automatic Translation)
delete-depth-description=Đặt độ sâu của các mục CMIS được ánh xạ để loại bỏ khi xóa được gọi từ bên trong cổng thông tin. Các thiết lập sâu hơn, các cuộc gọi nhiều hơn để các máy chủ yêu cầu. Khi xóa được gọi là từ bên ngoài cổng thông tin, ánh xạ CMIS mục vẫn trì trệ trong cơ sở dữ liệu. Giá trị dự kiến là: -1 cho sâu, 0 cho không có, và 1 cho nông. (Automatic Translation)
delete-depth-name=Xóa Bỏ Độ sâu (Automatic Translation)