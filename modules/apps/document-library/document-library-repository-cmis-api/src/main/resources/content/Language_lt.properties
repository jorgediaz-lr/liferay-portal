delete-depth-description=Nustatykite susietų CMIS įrašų, kurie bus pašalinti, kai naikinimas iškviečiamas iš portalo, gylį. Kuo giliau nustatymas, tuo daugiau skambučių į serverį reikia. Kai naikinimas iškviečiamas iš portalo ribų, susieti CMIS įrašai duomenų bazėje lieka nekintami. Numatomos reikšmės: -1 giliai, 0 – nė vienas, o sekli – 1. (Automatic Translation)
