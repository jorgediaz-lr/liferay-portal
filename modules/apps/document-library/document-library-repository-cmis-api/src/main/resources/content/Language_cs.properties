delete-depth-description=Nastavte hloubku mapovaných položek CMIS, které chcete odebrat při odstranění z portálu. Čím hlubší nastavení, tím více volání na server vyžaduje. Při odstranění je volána z mimo portál, namapované položky CMIS zůstávají stagnující v databázi. Očekávané hodnoty jsou: -1 pro hluboké, 0 pro žádné a 1 pro mělké. (Automatic Translation)
