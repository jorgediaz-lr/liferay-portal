cmis-repository-configuration-name=Depozit CMIS (Automatic Translation)
delete-depth-description=Setați adâncimea intrărilor CMIS mapate pentru a o elimina atunci când se apelează o ștergere din interiorul portalului. Cu cât setarea este mai profundă, cu atât sunt necesare mai multe apeluri către server. Când o ștergere este apelată din afara portalului, intrările CMIS mapate rămân stagnante în baza de date. Valorile așteptate sunt: -1 pentru adâncime, 0 pentru niciunul și 1 pentru superficial. (Automatic Translation)
delete-depth-name=Ștergere adâncime (Automatic Translation)