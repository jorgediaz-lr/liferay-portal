file-extensions=檔案副檔名
file-extensions-help=* 的檔案擴展名將允許所有檔案副檔名。 (Automatic Translation)
file-max-size=最大檔案大小
file-max-size-help=設定文件的最大檔案大小和有效檔案副檔名。最大檔案大小的值 0 可用於指示無限檔案大小。但是,允許的最大檔案大小由「上傳服務請求」配置中的「總體最大上傳請求大小」屬性設置。 (Automatic Translation)
maximum-number-of-versions=最大版本數
maximum-number-of-versions-help=設置每個文件將存儲的最大版本數。值 0 可用於指示無限數量的版本。 (Automatic Translation)
multimedia-file-mime-types=多媒體檔案 MIME 類型
presentation-file-mime-types=簡報檔 MIME 類型
previewable-processor-max-size=可預覽處理器最大大小 (Automatic Translation)
previewable-processor-max-size-help=設置預覽和縮略圖生成的最大檔案大小。大於此屬性中指定的值的檔不會導致生成預覽的處理器的執行。值 -1 表示將處理所有檔。值為 0 表示不會處理任何檔。預設最大大小為 100 MB。 (Automatic Translation)
