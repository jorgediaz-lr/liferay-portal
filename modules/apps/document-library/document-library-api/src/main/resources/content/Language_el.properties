file-max-size=Μέγιστο μέγεθος αρχείων
file-max-size-help=Ορίστε το μέγιστο μέγεθος αρχείου και τις έγκυρες επεκτάσεις αρχείων για έγγραφα. Η τιμή 0 για το μέγιστο μέγεθος αρχείου μπορεί να χρησιμοποιηθεί για να υποδείξει απεριόριστο μέγεθος αρχείου. Ωστόσο, το μέγιστο επιτρεπόμενο μέγεθος αρχείου ορίζεται από την ιδιότητα "Συνολικό μέγιστο μέγεθος αίτησης αποστολής" στη ρύθμιση παραμέτρων "Αποστολή αίτησης Servlet". (Automatic Translation)
maximum-number-of-versions=Μέγιστος αριθμός εκδόσεων (Automatic Translation)
maximum-number-of-versions-help=Ορίστε το μέγιστο αριθμό εκδόσεων που θα αποθηκευτούν ανά έγγραφο. Η τιμή 0 μπορεί να χρησιμοποιηθεί για την ένδειξη απεριόριστου αριθμού εκδόσεων. (Automatic Translation)
