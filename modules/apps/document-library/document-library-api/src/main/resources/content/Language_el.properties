previewable-processor-max-size=Μέγιστο μέγεθος επεξεργαστή με δυνατότητα προεπισκόπησης (Automatic Translation)
previewable-processor-max-size-help=Ορίστε το μέγιστο μέγεθος αρχείου για την προεπισκόπηση και τη δημιουργία μικρογραφιών. Τα αρχεία μεγαλύτερα από την τιμή που καθορίζεται σε αυτήν την ιδιότητα δεν θα έχουν ως αποτέλεσμα την εκτέλεση ενός επεξεργαστή που δημιουργεί μια προεπισκόπηση. Η τιμή -1 δηλώνει ότι θα γίνει επεξεργασία όλων των αρχείων. Η τιμή 0 δηλώνει ότι δεν θα γίνει επεξεργασία αρχείων. Το προεπιλεγμένο μέγιστο μέγεθος είναι 100 megabyte. (Automatic Translation)
