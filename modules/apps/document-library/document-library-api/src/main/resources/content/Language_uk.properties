previewable-processor-max-size-help=Установіть максимальний розмір файлу для попереднього перегляду та створення ескізів. Файли, більші за значення, указане в цій властивості, не призведе до виконання процесора, який генерує попередній перегляд. Значення -1 вказує на те, що всі файли буде оброблено. Значення 0 вказує на те, що файли не буде оброблено. Максимальний розмір за промовчанням – 100 мегабайт. (Automatic Translation)
