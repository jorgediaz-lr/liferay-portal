file-max-size-help=Nustatykite maksimalų dokumentų failo dydį ir tinkamus failų plėtinius. Maksimalaus failo dydžio reikšmę 0 galima naudoti neribotam failo dydžiui nurodyti. Tačiau maksimalus leidžiamas failo dydis nustatomas pagal konfigūracijoje "Įkelti servlet užklausą" ypatybę "Bendras maksimalus įkėlimo užklausos dydis". (Automatic Translation)
