versioning-strategy-overridable-help=Nustatykite, ar vartotojai galės nepaisyti numatytosios versijos strategijos. Jei įjungta, vartotojai turės galimybę pasirinkti pasirinktinį versijos numerio padidinimą. (Automatic Translation)