previewable-processor-max-size=Maksimalus peržiūrimas procesorius (Automatic Translation)
previewable-processor-max-size-help=Nustatykite maksimalų failo dydį peržiūrai ir miniatiūrų generavimui. Failai, didesni už šioje ypatybėje nurodytą reikšmę, nesukurs procesoriaus, kuris generuoja peržiūrą, vykdymo. Reikšmė -1 nurodo, kad visi failai bus apdorojami. Reikšmė 0 nurodo, kad failai nebus apdorojami. Numatytasis maksimalus dydis yra 100 megabaitų. (Automatic Translation)
