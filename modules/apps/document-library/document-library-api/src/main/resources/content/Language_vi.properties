previewable-processor-max-size=Bộ xử lý có thể xem trước Kích thước tối đa (Automatic Translation)
previewable-processor-max-size-help=Đặt kích thước tệp tối đa để xem trước và tạo hình thu nhỏ. Tệp lớn hơn giá trị được chỉ định trong thuộc tính này sẽ không dẫn đến việc thực hiện bộ xử lý tạo bản xem trước. Giá trị -1 chỉ ra rằng tất cả các tệp sẽ được xử lý. Giá trị 0 chỉ ra rằng không có tệp nào sẽ được xử lý. Kích thước tối đa mặc định là 100 megabyte. (Automatic Translation)
