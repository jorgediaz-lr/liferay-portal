file-max-size-help=Đặt kích thước tệp tối đa và phần mở rộng tệp hợp lệ cho tài liệu. Một giá trị của 0 cho kích thước tập tin tối đa có thể được sử dụng để chỉ ra kích thước tập tin không giới hạn. Tuy nhiên, kích thước tệp tối đa cho phép được thiết lập bởi các "Tổng thể tối đa tải lên yêu cầu kích thước" trong cấu hình "Tải lên Servlet yêu cầu". (Automatic Translation)
