liferay-releng-app-description=Westeros Bank هو ملمح معتدِّل مستلهم من مواقع البنوك الموجودة. ويوفر أساسًا راسخًا لبدء تشغيل موقعك المالي. يوفر Westeros Bank فقط التحميلات الضرورية، ما يسمح لك ببناء تجاربك المخصصة فوقها.<br /><br />يتضمن ملمح Westeros Bank الميزات المفيدة التالية:<ul><li>محتوى هيكلي لإنشاء تخطيطات أنيقة للعديد من حالات الاستخدام</li><li>عناصر نائبة للتنقل قابلة للتخصيص تتيح لك إنشاء تجارب تنقل مدروسة بدقة</li></ul>ملاحظة: بمجرد تثبيت هذا الملمح، يمكنك الوصول إليه كقالب موقع عن طريق لوحة التحكم.