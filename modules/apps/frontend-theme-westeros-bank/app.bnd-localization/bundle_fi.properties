liferay-releng-app-description=Westeros Bank on minimalistinen teema, joka on saanut innoituksensa olemassa olevista pankkisivustoista. Se tarjoaa vankan pohjan aloittaa oma taloussivustosi. Westeros Bank esittelee vain osat, joten voit helposti rakentaa mukautettuja kokemuksia sen päälle.<br /><br />Westeros Bank -teema sisältää nämä hyödylliset ominaisuudet:<ul><li>Jäsennelty sisältö tyylikkäiden ulkoasujen luomiseksi useille käyttötapauksille</li><li>Mukautettavat navigointipaikkamerkit, joiden avulla voit luoda hienojakoisen navigointikokemuksen.</li></ul>Huomaa: Kun tämä teema on asennettu, voit käyttää sitä sivustomallina Ohjauspaneelista.