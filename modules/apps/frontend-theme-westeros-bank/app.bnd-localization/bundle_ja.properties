liferay-releng-app-description=Westeros Bankは既存の金融機関のサイトをヒントにしたミニマルなテーマで、金融機関のサイトを新たに作成するための強固な基盤を提供します。Westeros Bankは最低限の労力しか必要とせず、簡単に独自のエクスペリエンスを構築できるようにします。<br /><br />Westeros Bankテーマの優れた特徴:<ul><li>複数のユースケースでエレガントなレイアウトを実現する構造化コンテンツ</li><li>調整可能なナビゲーションプレースホルダーがきめの細かいナビゲーション機能を実現</li></ul>注意: インストール後のテーマは、コントロールパネルからサイトテンプレートとしてアクセスできます。