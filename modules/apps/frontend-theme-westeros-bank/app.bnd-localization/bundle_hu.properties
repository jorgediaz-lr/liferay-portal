liferay-releng-app-description=A Westeros Bank egy minimalisztikus, meglévő bankok oldalai által ihletett téma. Szilárd alapot kínál az ön pénzügyi oldalai elindításához. A Westeros Bank csak a legszükségesebbeket nyújtja, amire könnyen ráépítheti a felhasználói élményt.<br /><br />A Westeros Bank téma leghasznosabb jellemzői:<ul><li>A strukturált tartalom elegáns elrendezések létrehozását teszi lehetővé a különféle felhasználási módokhoz</li><li>A testreszabható navigációs helyőrzőknek köszönhetően kifinomult navigációs élményt hozhat létre</li></ul>Megjegyzés: A téma a telepítése után webhely-sablonként érheti el a vezérlőpultról.