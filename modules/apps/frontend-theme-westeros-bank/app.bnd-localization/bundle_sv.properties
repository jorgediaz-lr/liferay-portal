liferay-releng-app-description=Westeros Bank är ett minimalistiskt tema inspirerat av befintliga bankwebbplatser. Det erbjuder en stabil grund för att komma igång med din finansiella webbplats. Westeros Bank introducerar bara en nödvändig mall som du kan använda för att enkelt skapa din anpassade upplevelse.<br /><br />Westeros Bank-temat inkluderar dessa användbara funktioner:<ul><li>Strukturerat innehåll för att skapa eleganta layouter för flera användningsfall</li><li>Anpassningsbara platshållare för navigering som du kan använda för att skapa en detaljerad navigeringsupplevelse</li></ul>Obs! När det här temat installerats kan du öppna det som en webbplatsmall genom kontrollpanelen.