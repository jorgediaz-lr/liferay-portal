liferay-releng-app-description=Westeros Bank és un tema minimalista inspirat en llocs web bancaris existents. Ofereix uns fonaments sòlids per començar amb el vostre lloc web financer. Westeros Bank introdueix només els elements imprescindibles, i us permet construir fàcilment experiències personalitzades a sobre.<br /><br /> El tema Westeros Bank inclou aquestes funcions útils:<ul><li>Un contingut estructurat per crear disposicions elegants per a diversos casos pràctics</li><li>Variables de navegació personalitzables que us permeten crear una experiència de navegació molt detallada</li></ul>Nota: un cop instal·lat aquest tema, tindreu l'opció de crear un lloc web totalment funcional de tipus Porygon des del tauler Administració de llocs web.