liferay-releng-app-description=Westeros Bank es un tema minimalista inspirado por sitios de bancos existentes. Proporciona una base sólida para empezar con su sitio financiero. Westeros Bank solo introduce la sobrecarga necesaria, lo que permite crear fácilmente experiencias personalizadas.<br /><br />En el tema Westeros Bank, se incluyen estas útiles características:<ul><li>Contenidos estructurados para crear diseños elegantes para distintos casos de uso</li><li>Marcadores de posición de navegación personalizables que le permiten crear una experiencia de navegación específica</li></ul>Nota: Después de instalar el tema, podrá acceder a este como una plantilla de sitio mediante el panel de control.