liferay-releng-app-description=El tema Porygon se ha diseñado para mostrar revistas digitales. Porygon es un tema moderno y atractivo visualmente que da nueva vida a sus increíbles contenidos.<br /><br />El tema Porygon ofrece estas útiles características:<ul><li>Diversas opciones de visualización para previsualizar contenidos</li><li>Contenidos estructurados para crear diseños elegantes para distintos casos de uso</li><li>Compatibilidad con blogs y contenidos</li><li>Diez artículos de ejemplo con fotos de gran tamaño y contenidos realistas</li><li>Un decorador de portlets que puede usar para mostrar contenidos específicos o una aplicación</li><li>Integración con búsquedas sutil y minimalista</li></ul><br /><br />Nota: Después de instalar el tema, podrá crear un sitio completamente funcional del tipo Porygon desde el panel de administración de sitios.