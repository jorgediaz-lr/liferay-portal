liferay-releng-app-description=El tema Porygon està dissenyat per mostrar la vostra revista digital. Porygon és un tema modern i visualment atractiu que revitalitza el vostre fantàstic contingut.<br /><br />El tema Porygon inclou aquestes funcions útils:<ul><li>Disverses opcions de visualització per a la vista prèvia del contingut</li><li>Un contingut estructurat per crear disposicions elegants per a diversos casos pràctics</li><li>Compatibilitat amb els blogs i el contingut</li><li>16 exemples d'articles amb grans fotos i continguts realistes</li><li>Un Decorador de portlets que podeu utilitzar per mostrar determinats continguts o una aplicació</li><li>Integració de cerca subtil i minimalista</li></ul><br /><br />Nota: un cop instal·lat aquest tema, tindreu l'opció de crear un lloc web totalment funcional de tipus Porygon des del tauler Administració de llocs web.