liferay-releng-app-description=Porygon テーマは、デジタル書籍を紹介するのに適しています。Porygon は魅力的な外観のモダンなテーマで、高品質な既存のコンテンツに新たな命を吹き込みます。<br /><br />Porygon テーマの優れた特徴:<ul><li>さまざまなコンテンツプレビュー表示オプション</li><li>複数のユースケースでエレガントなレイアウトを実現する構造化コンテンツ</li><li>ブログとコンテンツのマッチング支援</li><li>大きな画像とリアルなコンテンツを含む 16 種類の記事サンプル</li><li>特定のコンテンツやアプリケーションの紹介に使用できる Portlet Decorator</li><li>複雑かつミニマルな検索連携</li></ul><br /><br />注意: このテーマをインストールすると、サイト管理パネルからPorygon タイプの完全に動作するサイトを作成するオプションが表示されます。