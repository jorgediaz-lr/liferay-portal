liferay-releng-app-description=Porygonテーマは、デジタル書籍を紹介するのに適しています。Porygonは魅力的な外観のモダンなテーマで、高品質な既存のコンテンツに新たな命を吹き込みます。<br /><br />Porygonテーマの優れた特徴:<ul><li>さまざまなコンテンツプレビュー表示オプション</li><li>複数のユースケースでエレガントなレイアウトを実現する構造化コンテンツ</li><li>ブログとコンテンツのマッチング支援</li><li>大きな画像とリアルなコンテンツを含む16種類の記事サンプル</li><li>特定のコンテンツやアプリケーションの紹介に使用できるPortlet Decorator</li><li>スマートかつ最小限の検索連携</li></ul><br /><br />注意: このテーマをインストールすると、サイト管理パネルからPorygonを使用して完全に動作するサイトを作成するオプションが表示されます。