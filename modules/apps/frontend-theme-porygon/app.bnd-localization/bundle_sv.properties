liferay-releng-app-description=Porygon-temat är designat att visa upp ditt digitala magasin. Porygon är ett modernt och visuellt attraktivt tema som väcker liv i ditt redan fantastiska innehåll.<br /><br />Porygon-temat inkluderar dessa användbara funktioner:<ul><li>Olika visningsalternativ för att förhandsgranska innehåll</li><li>Strukturerat innehåll för att skapa eleganta layouter för flera användningsfall</li><li>Support för bloggar och innehåll</li><li>16 artikelexempel med stora foton och realistiskt innehåll</li><li>Portletdekoratör du kan använda för att visa upp specifikt innehåll eller en applikation</li><li>Snygg och minimalistisk sökintegration</li></ul><br /><br />Obs! När temat installerats har du möjligheten att skapa en fullt fungerande webbplats av Porygon-typ från panelen för webbplatsadministration.