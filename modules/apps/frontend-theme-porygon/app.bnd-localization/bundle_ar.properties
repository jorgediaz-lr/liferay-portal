liferay-releng-app-description=صُمم ملمح Porygon لإظهار مجلتك الرقمية. يعتبر Porygon ملمحًا عصريًا وجذابًا بصريًا يجلب حياة جديدة لمحتوى المجلة الخاصة بك بالفعل.<br /><br />يتضمن ملمح Porygon الميزات المفيدة التالية:<ul><li>خيارات العرض المختلفة لمعاينة المحتوى</li><li>محتوى هيكلي لإنشاء تخطيطات أنيقة للعديد من حالات الاستخدام</li><li>دعم المطابقة للمدونات والمحتوى</li><li>16 نموذج مقال مع صور كبيرة ومحتوى واقعي</li><li>أداة تزيين المدخل Portlet Decorator يمكنك استخدامها لعرض محتوى خاص أو تطبيق</li><li>تكامل البحث البسيط والبارع</li></ul><br /><br />ملاحظة: بمجرد تثبيت هذا الملمح، سيتوفر لك خيار لإنشاء موقع جاهزًا للعمل بالكامل من نوع Porygon من لوحة إدارة المواقع Sites Administration.