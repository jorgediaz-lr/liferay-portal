liferay-releng-app-description=Porygon-teema on suunniteltu esittelemään digitaalista aikakauslehtiäsi. Porygon on moderni ja visuaalisesti houkutteleva teema, joka tuo uutta elämää jo hämmästyttävään sisältöösi.<br /><br />Porygon-teema sisältää nämä hyödylliset ominaisuudet:<ul><li>Erilaisia näyttövaihtoehtoja sisällön esikatseluun</li><li>Jäsennelty sisältö tyylikkäiden ulkoasujen luomiseksi useille käyttötapauksille</li><li>Blogien ja sisällön vastaava tuki</li><li>16 artikkeliesimerkkiä suurilla valokuvilla ja realistisella sisällöllä</li><li>Portlet Decorator -työkalu, jolla voit esitellä tiettyä sisältöä tai sovellusta.</li><li>Hienovarainen ja minimalistinen hakuintegraatio</li></ul><br /><br />Huomaa: Kun tämä teema on asennettu, on mahdollisuus luoda täysin toimiva Porygon-tyyppinen sivusto sivustojen hallintapaneelista.