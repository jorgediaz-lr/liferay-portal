liferay-releng-app-description=Porygon 主题非常适合展示您的数字杂志。Porygon 是一款现代且极具视觉吸引力的主题，可让已有的精美内容焕然一新。<br /><br />Porygon 主题包含下列实用功能：<ul><li>用于内容预览的各种显示选项</li><li>可为多个用例创建精致布局的结构化内容</li><li>对博客和内容的匹配支持</li><li>16 个包含大图片和真实内容的文章示例</li><li>可以用来展示特定内容或应用程序的 Portlet 装饰器</li><li>微妙而简约的搜索集成</li></ul><br /><br />注意：安装此主题后，您可以从"站点管理"面板中选择创建一个 Porygon 类型的全功能站点。