liferay-releng-app-description=A Porygon téma az ön digitális folyóiratának a kiállítására szolgál. A Porygon egy modern és látványos téma, amely még több életet visz az amúgy is káprázatos tartalomba.<br /><br />A Porygon téma néhány leghasznosabb tulajdonsága:<ul><li>Különböző megjelenítési lehetőségek a tartalom előnézetéhez</li><li>A strukturált tartalom elegáns elrendezések kialakítását teszi lehetővé a különféle felhasználási módokhoz</li><li>Összehangolt támogatás a blogokhoz és a tartalmakhoz</li><li>16 példa cikkekre, nagy fényképekkel és realisztikus tartalommal</li><li>Egyéni tartalom vagy alkalmazás megjelenítésére egyaránt felhasználható Portlet Decorator</li><li>Beépíthető diszkrét, minimalisztikus keresés</li></ul><br /><br />Megjegyzés: A téma telepítése után lehetőséget kap egy teljesen üzemképes, Porygon típusú webhely létrehozására a Webhely adminisztrációja panelből.