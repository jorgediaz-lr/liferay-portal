liferay-releng-app-description=Ez a Flash alkalmazás lehetővé teszi az Adobe Flash tartalom Liferay oldalon történő egyszerű közzétételét. A Flash forrásfájl URL-címmel adható meg, így videók, bemutatók, játékok is publikálhatók távoli weboldalról, vagy közvetlenül a Liferay Dokumentumok és médiafájlok galériájából.<br /><br />Az alkalmazás a telepítés után az Alkalmazás menüben jelenik meg.