liferay-releng-app-description=La aplicación Flash permite publicar fácilmente contenidos de Adobe Flash en Liferay. El archivo de código fuente de Flash se puede especificar mediante una URL, por lo que se pueden publicar vídeos, presentaciones y juegos desde un sitio web remoto, o bien directamente desde la galería de Documentos y Multimedia de Liferay.<br /><br />La aplicación se mostrará en el menú Aplicación después de la instalación.