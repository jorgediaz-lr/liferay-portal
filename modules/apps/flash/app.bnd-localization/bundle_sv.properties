liferay-releng-app-description=Flash-appen gör det enkelt att publicera Adobe Flash-innehåll på Liferay. Flash-källfilen kan anges genom en URL så det går att publicera videor, presentation och spel från en fjärrwebbplats eller direkt från Liferays Dokument och media-galleri.<br /><br />Den här appen visas i din programmeny när den installerats.