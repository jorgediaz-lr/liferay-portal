liferay-releng-app-description=Aquesta aplicació Flash permet publicar fàcilment contingut d'Adobe Flash a Liferay. El fitxer Flash d'origen es pot especificar mitjançant un URL, de manera que és possible publicar vídeos, presentacions i jocs des d'un lloc web remot o directament des de la galeria de Documents i Multimèdia de Liferay.<br /><br />Aquesta aplicació apareixerà al menú d'aplicacions un cop instal·lada.