liferay-releng-app-description=Tämä Flash-sovellus mahdollistaa Adobe Flash -sisällön helpon julkaisemisen Liferay-sovelluksessa. Flash-lähdetiedosto voidaan määrittää URL-osoitteen kautta, joten on mahdollista julkaista videoita, esityksiä, pelejä etäsivustolta tai suoraan Liferayn asiakirjoista ja mediagalleriasta.<br /><br />Tämä sovellus näkyy sovellusvalikossa, kun se on asennettu.