liferay-releng-app-description=يسمح تطبيق Flash هذا بالنشر السهل لمحتوى Adobe Flash على Liferay. ويمكن تحديد ملف مصدر Flash عن طريق عنوان URL ومن ثم يمكن نشر الفيديوهات والعروض التقديمية والألعاب من موقع بعيد، أو مباشرة من معرض المستندات والوسائط في Liferay.<br /><br />سوف يظهر هذا التطبيق في قائمة التطبيقات الخاصة بك بمجرد تثبيته.