liferay-releng-app-description=借助此应用，Liferay 能够检测到哪个移动设备或操作系统正在处理任意给定请求，并根据检测到的设备更改页面的布局/渲染。安装后，您可以定义新的移动设备规则并将这些规则应用于站点和各个页面。浏览网页的移动设备用户比例一直在稳定增长，因此能够适当地处理各类设备至关重要。例如，您可以配置智能手机或平板电脑用户访问的 Liferay 页面的外观，而不是配置 PC 用户访问的此类页面外观。可以为站点和各个页面配置用于描述一组设备的任意数量规则组。它可以包含一个或多个描述设备类别（例如，所有 Android 设备或所有 iOS 平板电脑）的规则。可以设定规则组的优先级，以确定将哪个规则组应用于给定的页面请求。您可以根据需要定义任意多个规则，以便为要对其执行操作的所有设备分类。此应用中的设备数据库包含约 200,000 种设备组合（设备、软件和浏览器组合）和 60 个属性。<br /><br />此应用作为 Liferay 服务安装。