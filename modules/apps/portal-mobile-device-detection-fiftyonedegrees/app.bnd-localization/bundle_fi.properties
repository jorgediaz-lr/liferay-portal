liferay-releng-app-description=Tämän sovelluksen avulla Liferay pystyy havaitsemaan mitä mobiililaitetta tai käyttöjärjestelmää käytetään mihinkään tiettyyn pyyntöön ja muuttaa sivujen asettelua/renderöintiä havaitun laitteen perusteella. Asennuksen jälkeen voit määrittää uudet mobiililaitesäännöt ja soveltaa niitä sivustoille ja yksittäisille sivuille. Verkkoa selaavien mobiililaitteiden käyttäjien osuus on kasvanut tasaisesti, joten on tärkeää pystyä käsittelemään erilaisia ​​laitteita asianmukaisesti. Voit esimerkiksi määrittää älypuhelimen tai tabletin käyttäjien käyttämien Liferay-sivujen ulkoasun ja tuntuman eri tavalla kuin tietokoneiden käyttäjät. Sekä sivustot että yksittäiset sivut voidaan määrittää millä tahansa määrällä sääntöryhmiä, jotka on suunniteltu kuvaamaan laiteryhmää. Se voi sisältää yhden tai useamman säännön, joka kuvaa laiteluokkaa, kuten kaikki Android-laitteet tai kaikki iOS-tabletit. Sääntöryhmät voidaan priorisoida sen määrittämiseksi, kumpi sovelletaan tiettyyn sivupyyntöön. Voit määrittää niin monta sääntöä kuin tarvitset luokitellaksesi kaikki laitteet, joihin haluat ryhtyä. Tämän sovelluksen laitetietokanta sisältää noin 200 000 laiteyhdistelmää (laite-, ohjelmisto- ja selainyhdistelmät) ja 60 ominaisuutta.<br /><br />Tämä sovellus asennetaan Liferay-palveluna.