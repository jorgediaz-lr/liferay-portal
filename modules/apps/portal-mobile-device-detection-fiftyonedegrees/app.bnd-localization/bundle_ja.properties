liferay-releng-app-description=このアプリは、Liferayが所定のリクエストにどのモバイルデバイスやOSが使用されているかを検出し、検出したデバイスに応じてページのレイアウトや表示を変更できるようにします。インストール後、新しいモバイルデバイスのルールを定義し、サイトや個別ページに適用できるようになります。モバイルデバイスでWebを閲覧するユーザーの比率は着実に増加しているため、異なる種類のデバイスを適切に処理できることは非常に重要です。例えば、スマートフォンやタブレットのユーザーがアクセスするLiferayページをPCのユーザーがアクセスするものとは異なる表示に設定できます。サイトと個別ページの両方を、デバイスのグループを表現する任意の数のルールグループを使って構成できます。ルールグループには、デバイスのカテゴリ（すべてのAndroidデバイス、すべてのiOSタブレットなど）を表現するルールを1つ以上含めることができます。ルールグループに優先順位を設定し、どのルールグループを所定のページリクエストに適用するかを決めることができます。対応したいすべてのデバイスを分類するのに必要な数のルールを定義できます。このアプリのデバイスデータベースには、約200,000件のデバイスの組み合わせ（デバイス、ソフトウェア、ブラウザの組み合わせ）と60件のプロパティが登録されています。<br /><br />このアプリは、Liferayのサービスとしてインストールされます。