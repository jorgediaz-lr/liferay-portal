liferay-releng-app-description=Fjord és un tema minimalista inspirat per llocs web de productes existents. Et permet crear un lloc web atractiu i per mostrar i promoure el teu producte. Fjord introdueix només els elements imprescindibles, i us permet construir fàcilment experiències personalitzades a sobre.<br /><br />El tema de Fjord inclou aquestes funcions clau:<ul><li>Plantilles de fragments i de pàgines que us permeten crear fàcilment contingut atractiu per al vostre lloc web</li><li>Enllaços de xarxes socials configurables</li><li>Navegació a pantalla completa configurable</li></ul>Fjord inclou un kit d'introducció que conté plantilles de fragments i pàgines que podeu utilitzar; creeu un lloc web nou amb aquest tema com a plantilla per poder-hi accedir!