liferay-releng-app-description=Fjord es un tema minimalista inspirado por sitios de productos existentes. Le permite crear un sitio atractivo para mostrar y promocionar su producto. Fjord solo introduce la sobrecarga necesaria, lo que le permite crear fácilmente experiencias personalizadas sobre este.<br /><br />En el tema de Fjord, se incluyen estas características principales:<ul><li>Fragmentos y plantillas de página que le permiten crear fácilmente contenidos atractivos para su sitio</li><li>Enlaces de redes sociales configurables</li><li>Navegación de pantalla completa configurable</li></ul>En Fjord, se incluye un kit de inicio que contiene fragmentos y plantillas de página que puede usar; para acceder a estos, cree un sitio con este tema como plantilla.