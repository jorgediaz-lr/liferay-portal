liferay-releng-app-description=Fjord on minimalistinen teema, joka ovat innoittaneet olemassa olevat tuotesivustot. Sen avulla voit luoda houkuttelevan ja koukuttavan sivuston tuotteen esittelemiseksi ja mainostamiseksi. Fjord sisältää vain tarvittavat osat, joten voit helposti rakentaa mukautettuja kokemuksia sen päälle.<br /><br />Fjord-teema sisältää nämä tärkeimmät ominaisuudet:<ul><li>Fragmentit ja sivumallit, joiden avulla voit helposti luoda houkuttelevaa sisältöä sivustollesi</li><li>Määritettävät sosiaalisen median linkit</li><li>Määritettävät koko näytön navigoinnit</li></ul>Fjordin mukana tulee Starter Kit, joka sisältää fragmentteja ja sivumalleja käyttöösi; Luot vain uuden sivuston, jonka malli on tämä teema, niin pääset niihin käsiksi!