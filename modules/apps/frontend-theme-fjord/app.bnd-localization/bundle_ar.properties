liferay-releng-app-description=Fjord هو ملمح مُعتدِّل مستلهم من مواقع المنتجات الموجودة. ويتيح لك إنشاء موقع جذاب وتفاعلي لإظهار منتجك والترويج له. يقدم Fjord فقط التحميلات الضرورية، ما يسمح لك ببناء تجاربك المخصصة بسهولة فوقها.<br /><br />يتضمن ملمح Fjord الميزات الرئيسية التالية:<ul><li>تقسيمات وقوالب الصفحة التي تتيح لك إنشاء محتوى جذاب بسهولة لموقعك</li><li>ارتباطات قابلة للتكوين بوسائل التواصل الاجتماعي</li><li>التنقل القابل للتكوين ملء الشاشة</li></ul>يأتي Fjord مزودًا بأدوات بداية تحتوي على التقسيمات وقوالب الصفحة لكي تستخدمها؛ عليك فقط إنشاء موقع جديد بهذا الملمح كقالب لكي تتمكن من الوصول إلى هذه الأدوات!