liferay-releng-app-description=Fjordは、既存の製品サイトをヒントにしたミニマルなテーマです。製品の紹介と宣伝用に使える訴求力の高い魅力的なサイトを作成するのに役立ちます。Fjordは最低限の労力しか必要とせず、簡単に独自のエクスペリエンスを構築できるようにします。<br /><br />Fjordテーマの主な特徴:<ul><li>フラグメントとページのテンプレートでサイト用の魅力的なコンテンツを簡単に作成可能</li><li>ソーシャルメディアのリンクを調整可能</li><li>全画面ナビゲーションを調整可能</li></ul>Fjordには、すぐに使用できるフラグメントとページのテンプレートを含むスターターキットが同梱されています。このテーマをテンプレートに使用して新しいサイトを作成するだけで、アクセスできるようになります！