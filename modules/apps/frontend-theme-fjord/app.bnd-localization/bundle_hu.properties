liferay-releng-app-description=A Fjord egy minimalisztikus, meglévő termékoldalak által ihletett téma. Vonzó és magával ragadó oldalak létrehozását teszi lehetővé terméke kiállításához és reklámozásához. A Fjord csak a legszükségesebbeket nyújtja, amire könnyen ráépítheti a felhasználói élményt.<br /><br />A Fjord téma fő jellemzői:<ul><li>A fragmensek és az oldalsablonok megkönnyítik webhelye tartalmának a létrehozását</li><li>Konfigurálható hivatkozások közösségi médiákra</li><li>Konfigurálható egész képernyős navigáció</li></ul>A Fjord kezdőcsomagot tartalmaz jól felhasználható fragmensekkel és oldalsablonokkal; elég létrehozni egy új webhelyet ezzel a témával, és máris a rendelkezésére áll!