liferay-releng-app-description=Fjord har ett minimalistiskt tema som inspireras av befintliga produktplatser. Du kan skapa en snygg och interaktiv webbplats för att visa upp och marknadsföra din produkt. Fjord introducerar bara nödvändig overhead så att du enkelt kan anpassa din upplevelse med den.<br /><br />Fjord-temat inkluderar dessa huvudfunktioner:<ul><li>Fragment och sidmallar så att du kan skapa attraktivt innehåll för din webbplats</li><li>Sociala medier-länkar som kan konfigureras</li><li>Helskärmsnavigering som kan konfigureras</li></ul>Fjord kommer med ett startpaket som innehåller fragment och sidmallar som du kan använda. Du behöver bara skapa en ny webbplats med det här temat som mall och få åtkomst till dem!