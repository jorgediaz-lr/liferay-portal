liferay-releng-app-description=Aquesta aplicació està obsoleta. Es possible que les pròximes actualitzacions i versions no estiguin disponibles.<br /><br />El portlet de formularis web és una eina que permet que un administrador web defineixi un formulari perquè es publiqui al lloc web. A continuació, els usuaris que visitin el lloc web poden omplir el formulari, que posteriorment s'envia a una adreça electrònica configurada o es desa (en un fitxer o una base de dades). El títol, una descripció introductòria del formulari, l'adreça electrònica i moltes altres opcions que es mostren als usuaris són configurables a través de la pantalla de configuració del portlet. És possible tenir diversos formularis a la mateixa pàgina o escampats en diverses pàgines. Les opcions de desar també inclouen la possibilitat de desar-lo com a fitxer CSV (Valors separats per comes) extern, o desar els valors en una taula de base de dades personalitzada per processar-la posteriorment.<br /><br /> Aquesta aplicació es mostrarà al menú de la vostra aplicació un cop instal·lada.