liferay-releng-app-description=هذا التطبيق بالحالة مهمل. قد تكون التحديثات والإصدارات المستقبلية غير متوفرة.<br /><br />يمثل مدخل نماذج الويب أداة تسمح لمسؤول الويب تحديد النموذج المطلوب نشره في موقع الويب. يمكن للمستخدمين الذين يزورون موقع الويب بعد ذلك ملء النموذج والذي يتم إرساله إلى عنوان بريد إلكتروني مكوّن أو حفظه (في ملف أو قاعدة بيانات). ويكون العنوان ووصف مقدمة النموذج وعنوان البريد الإلكتروني والعديد من الخيارات الأخرى المعروضة للمستخدمين قابلة للتكوين عن طريق شاشة التكوين بالمدخل. ومن الممكن إظهار عدة نماذج على نفس الصفحة أو نشرها على عدة صفحات. وتشمل خيارات الحفظ أيضًا إمكانية الحفظ كملف CSV (قيم مفصولة بفاصلة)، أو حفظ القيم في جدول قاعدة بيانات مخصص لإجراء معالجة إضافية.<br /><br />سوف يظهر هذا التطبيق في قائمة التطبيقات بمجرد تثبيته.