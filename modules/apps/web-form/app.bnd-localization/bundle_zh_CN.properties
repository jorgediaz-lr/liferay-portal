liferay-releng-app-description=此应用已弃用。更新和将来的版本可能不可用。<br /><br />Web 表单 Portlet 是一种工具，允许 Web 管理员定义要在网站中发布的表单。随后，访问该网站的用户可以填写表单，然后将其发送到配置的电子邮件地址或将其保存（到文件或数据库）。可以通过 portlet 的配置屏幕来配置向用户显示的标题、表单的介绍性描述、电子邮件地址以及许多其他选项。多个表单可能位于同一页面上，也可能分布在多个页面中。此外，保存选项还包含另存为外部 CSV（逗号分隔值）文件或将值保存到自定义数据库表中以供进一步处理的功能。<br /><br />安装后，此应用将出现在"应用程序"菜单中。