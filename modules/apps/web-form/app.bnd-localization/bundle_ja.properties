liferay-releng-app-description=このアプリは廃止予定です。今後、更新や新しいバージョンの提供は行われません。<br /><br />Webフォームポートレットは、Web管理者がウェブサイト内で公開するフォームを定義できるツールです。Webサイトを訪問したユーザーはフォームに記入することができます。また、その内容は設定されたメールアドレスに送信されるか、（ファイルまたはデータベースに）保存されます。ユーザーに表示されるタイトル、フォームの説明、メールアドレス、その他多くのオプションは、ポートレットの設定画面で調整できます。同じページに複数のフォームを配置することも、複数のページにまたがって分散させることもできます。値は外部のCSV（カンマ区切り値）ファイルに保存することも、独自のデータベーステーブルに保存して処理させることもできます。<br /><br />インストール後、このアプリはアプリケーションメニューに表示されます。