liferay-releng-app-description=Esta aplicación está en desuso. Puede que las actualizaciones y versiones futuras no estén disponibles.<br /><br />Este portlet de formularios web es una herramienta que permite a un administrador web definir un formulario que se publicará en el sitio web. Los usuarios que visiten el sitio web pueden completar el formulario que, a su vez, se envía a una dirección de correo electrónico configurada o se guarda en una ubicación (un archivo o una base de datos). El título, la descripción introductoria del formulario, la dirección de correo electrónico y muchas otras opciones mostradas a los usuarios se pueden configurar mediante la pantalla de configuración del portlet. También se pueden añadir varios formularios a la misma página, o bien crear formularios presentes en varias páginas. Entre las opciones de guardado, también se incluye la capacidad de guardar como un archivo CSV (valores separados por comas) externo, o bien guardar los valores en una tabla de base de datos personalizada para procesarlos posteriormente.<br /><br />La aplicación se mostrará en el menú Aplicación después de instalarla.