liferay-releng-app-description=Ez az alkalmazás Elavult állapotú. Lehet, hogy már nem jelennek meg frissítései vagy új verziói.<br /><br />A web űrlapok portlet eszköz lehetővé teszi a web adminisztrátorának, hogy definiáljon egy weboldalon megjelenő űrlapot. A webhelyre látogató felhasználók kitölthetik az űrlapot, amelyet elküldhetnek egy konfiguráció szerinti e-mail címre, vagy elmenthetik (fájlba vagy adatbázisba). Az űrlap címe, bevezetője, e-mail címe és a felhasználók előtt megjelenő számos további lehetőség a portlet konfigurációs képernyőjén konfigurálható. Egy oldalon több űrlap is megjelenhet, de az űrlapok több oldalra is kiterjedhetnek. Az opciók mentése külső CSV (comma-separated values) fájlként, vagy saját adatbázis-táblázatba történő mentést is lehetővé tesz a további feldolgozás céljaira.<br /><br />Az alkalmazás a telepítés után az Alkalmazás menüben jelenik meg.