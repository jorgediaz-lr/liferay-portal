liferay-releng-app-description=Tämä sovellus on vanhentuneessa tilassa. Päivitykset ja tulevat versiot eivät välttämättä ole käytettävissä.<br /><br />Verkkolomakeportlet on työkalu, jonka avulla järjestelmänvalvoja voi määrittää verkkosivustolla julkaistavan lomakkeen. Sivustolla vierailevat käyttäjät voivat sitten täyttää lomakkeen, joka sitten lähetetään määritettyyn sähköpostiosoitteeseen tai tallennetaan (tiedostoon tai tietokantaan). Otsikko, lomakkeen johdantokuvaus, sähköpostiosoite ja monet muut käyttäjille näytettävät vaihtoehdot ovat määritettävissä portlet-sovelluksen kokoonpanonäytössä. Samalla sivulla voi olla useita lomakkeita tai levitä usealle sivulle. Tallennusasetuksiin kuuluu myös mahdollisuus tallentaa ulkoisena CSV (Comma-Separated Values) -tiedostona tai tallentaa arvot mukautettuun tietokantataulukkoon jatkokäsittelyä varten.<br /><br />Tämä sovellus näkyy sovellusvalikossasi, kun se on asennettu.