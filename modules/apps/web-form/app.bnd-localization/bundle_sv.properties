liferay-releng-app-description=Den här appen har inaktuell status. Uppdateringar och framtida versioner kanske inte är tillgängliga.<br /><br />Portlet för webbformulär är ett verktyg som gör att webbadministratören kan definiera ett formulär som publiceras på webbplatsen. Användare som besöker webbplatsen kan sedan fylla i formuläret som skickas till en konfigurerad e-postadress eller sparas (på fil eller i databas). Titel, introduktionsbeskrivning av formuläret, e-postadress och flera andra alternativ som visas för användare kan konfigureras på konfigurationsskärmen för portlet. Det går att ha flera formulär på samma sida eller på flera sidor. Alternativ för att spara inkluderar möjligheten att spara som en extern CSV (kommaavgränsade värden)-fil eller att spara värdena i en anpassad databastabell för vidare bearbetning.<br /><br />Den här appen visas i din programmeny när det installerats.