indexing-batch-sizes=Партида размери за индексиране (Automatic Translation)
indexing-batch-sizes-help=Броят на документи да индексира на партида за модел типове тази подкрепа партида индексиране. По подразбиране 10000. За модели с големи документи намалява тази стойност може да подобри стабилността при изпълнение на пълен Преиндексиране. (Automatic Translation)
max-buffer-size=Максимален размер на буфера (Automatic Translation)
max-expansions=Максимални разширения (Automatic Translation)
max-expansions-help=Задайте броя на уникалните заглавия, които могат да се съпоставят, когато думите за търсене съвпадат със заглавието като префикс за фраза. (Automatic Translation)
minimum-buffer-availability-percentage=Буфер за минимална наличност процент (Automatic Translation)
nonbulk-indexing-override=Заместване на индексиране на небулване (Automatic Translation)
nonbulk-indexing-override-help=Стойността на "true" причинява променените обекти винаги да бъдат преиндексирани един по един. Поради причини за производителността тази настройка обикновено е изключена в производството. (Automatic Translation)
permission-filtered-search-result-accurate-count-threshold=Разрешение филтрирани търсене резултат точен брой праг (Automatic Translation)
permission-filtered-search-result-accurate-count-threshold-help=Ако дадена заявка за търсене връща резултатите от търсенето с брой, който е в рамките на този праг, общият брой след разрешение за филтриране е гарантирано да бъдат точни. (Automatic Translation)
permission-terms-limit=Разрешение условия ограничение (Automatic Translation)
permission-terms-limit-help=Задайте това да ограничи броя на думите за търсене на разрешение, които ще бъдат добавени към заявката за търсене. Ако този лимит е надхвърлен, термини за търсене няма разрешение ще бъдат добавени. Вместо това проверка на разрешение ще падне обратно към филтъра за търсене разрешение. (Automatic Translation)
