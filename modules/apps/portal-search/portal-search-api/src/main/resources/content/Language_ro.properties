indexing-batch-sizes-help=Numărul de documente pentru a indexa fiecare lot pentru modelul tipuri acel sprijin lot indexarea. Implicit la 10000. Pentru modelele cu documente mari, această valoare în scădere poate îmbunătăţi stabilitatea atunci când o Reindexare plin de executare. (Automatic Translation)
