nonbulk-indexing-override-help=Μια τιμή του "true" προκαλεί την επανεξάγοντας πάντα τροποποιημένες οντότητες μία προς μία. Για λόγους επιδόσεων, αυτή η ρύθμιση είναι γενικά απενεργοποιημένη στην παραγωγή. (Automatic Translation)
permission-filtered-search-result-accurate-count-threshold=Άδεια φιλτράρεται όριο αναζήτησης αποτέλεσμα ακριβής καταμέτρηση (Automatic Translation)
permission-filtered-search-result-accurate-count-threshold-help=Εάν ένα ερώτημα αναζήτησης επιστρέφει αποτελέσματα αναζήτησης με μια αρίθμηση που είναι μέσα σε αυτό το όριο, το συνολικό πλήθος μετά το φιλτράρισμα άδεια είναι εγγυημένη για να είναι ακριβή. (Automatic Translation)
permission-terms-limit=Άδεια όρους ορίου (Automatic Translation)
permission-terms-limit-help=Οριστεί για να περιορίσετε τον αριθμό των όρων αναζήτησης άδεια που θα προστεθεί στο ερώτημα αναζήτησης. Σε περίπτωση υπέρβασης αυτού του ορίου, θα προστεθεί καμία άδεια όρους αναζήτησης. Αντ ' αυτού, άδεια έλεγχος θα πέσει πίσω στο φίλτρο αναζήτησης άδεια. (Automatic Translation)
