nonbulk-indexing-override=Перевизначення індексування небулок (Automatic Translation)
nonbulk-indexing-override-help=Значення true призводить до того, що змінені сутності завжди переіндексуються один за одним. З міркувань продуктивності ця настройка, як правило, вимикається у виробництві. (Automatic Translation)
permission-filtered-search-result-accurate-count-threshold=Дозвіл фільтрується пошук результат точним графа поріг (Automatic Translation)
permission-filtered-search-result-accurate-count-threshold-help=Якщо пошуковий запит повертає результати пошуку з кол-во, що знаходиться в межах цього порогу, загальна кількість після фільтрації дозвіл є гарантується точною. (Automatic Translation)
permission-terms-limit=Дозвіл умовами межа (Automatic Translation)
permission-terms-limit-help=Встановити це обмежує кількість дозвіл пошукових термінів, які будуть додані до пошукового запиту. Якщо це обмеження перевищено, немає дозволу пошукові терміни додається. Замість цього, перевірка дозвіл переривається дозвіл Фільтр пошуку. (Automatic Translation)
