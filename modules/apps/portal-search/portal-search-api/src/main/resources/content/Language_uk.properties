indexing-batch-sizes=Індексування пакетного розмірів (Automatic Translation)
indexing-batch-sizes-help=Кількість документів, індексувати за партію для типи моделей, що пакетної підтримки індексування. За замовчуванням до 10000. Для моделей з великих документів зниження це значення може прискорити стабільності час виконання повного проіндексувати. (Automatic Translation)
