search-query-result-window-limit-help=Mengatur ini untuk membatasi jumlah hasil pencarian yang dapat diminta dari permintaan pencarian. (Automatic Translation)
synchronous-execution-override=Eksekutor Eksekusi Sinkron (Automatic Translation)
synchronous-execution-override-help=Nilai "true" menyebabkan reindexing entitas yang dimodifikasi selalu diblokir hingga selesai. Untuk alasan kinerja, pengaturan ini umumnya dimatikan dalam produksi. (Automatic Translation)
