indexer-registry-configuration-name=Indeks Registry (Automatic Translation)
indexing-batch-sizes=Pengindeksan Batch ukuran (Automatic Translation)
indexing-batch-sizes-help=Jumlah dokumen untuk mengindeks per batch untuk jenis model yang mendukung batch pengindeksan. Default untuk 10000. Untuk model dengan dokumen yang besar, penurunan nilai ini dapat meningkatkan stabilitas ketika menjalankan reindex penuh. (Automatic Translation)
max-buffer-size=Maksimum ukuran Buffer (Automatic Translation)
max-expansions=Ekspansi Maksimum (Automatic Translation)
max-expansions-help=Atur jumlah judul unik yang dapat dicocokkan saat istilah pencarian cocok dengan judul sebagai awalan frasa. (Automatic Translation)
minimum-buffer-availability-percentage=Persentase ketersediaan minimal Buffer (Automatic Translation)
nonbulk-indexing-override=Pengindeksan Nonbulk Menimpa (Automatic Translation)
nonbulk-indexing-override-help=Nilai "benar" menyebabkan entitas yang dimodifikasi selalu dieksdeksasi kembali satu per satu. Untuk alasan kinerja, pengaturan ini umumnya dimatikan dalam produksi. (Automatic Translation)
permission-filtered-search-result-accurate-count-threshold=Izin disaring Cari hasil akurat menghitung ambang (Automatic Translation)
permission-filtered-search-result-accurate-count-threshold-help=Jika permintaan pencarian kembali hasil pencarian dengan hitungan yang ada di dalam batas ini, jumlah total setelah izin penyaringan dijamin akan akurat. (Automatic Translation)
permission-terms-limit=Izin syarat batas (Automatic Translation)
permission-terms-limit-help=Mengatur ini untuk membatasi jumlah istilah pencarian izin yang akan ditambahkan ke permintaan pencarian. Jika batas ini melebihi, istilah pencarian izin tidak akan ditambahkan. Sebaliknya, memeriksa izin akan jatuh kembali ke filter pencarian izin. (Automatic Translation)
