disabled-entry-class-names-help=Tentukan nama kelas entri yang DefaultKeywordQueryContributor tidak akan menyertakan deskripsi, userName, dan bidang judul sebagai bagian dari permintaan pencarian kata kunci. (Automatic Translation)
