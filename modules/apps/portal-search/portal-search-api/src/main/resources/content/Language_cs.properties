indexing-batch-sizes=Indexování velikosti dávky (Automatic Translation)
indexing-batch-sizes-help=Počet dokumentů k indexování na dávku pro typy modelů které Podpora dávkové indexování. Výchozí hodnota je 10000. Pro modely s velkými dokumenty snížením této hodnoty může zlepšit stabilitu při provádění úplné reindex. (Automatic Translation)
