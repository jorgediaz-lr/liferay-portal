permission-filtered-search-result-accurate-count-threshold-help=Vyhledávací dotaz vrátí výsledky hledání s hrabětem, který je v rámci tohoto prahu, celkový počet po povolení filtrování je zaručeno být přesné. (Automatic Translation)
permission-terms-limit=Mezní podmínky oprávnění (Automatic Translation)
