search-query-result-window-limit-help=Thiết lập này để giới hạn số lượng kết quả tìm kiếm có thể được yêu cầu từ một truy vấn tìm kiếm. (Automatic Translation)
synchronous-execution-override=Ghi đè thực hiện đồng bộ (Automatic Translation)
synchronous-execution-override-help=Giá trị "true" khiến việc lập chỉ mục lại các thực thể đã sửa đổi luôn chặn cho đến khi hoàn tất. Vì lý do hiệu suất, cài đặt này thường bị tắt trong sản xuất. (Automatic Translation)
