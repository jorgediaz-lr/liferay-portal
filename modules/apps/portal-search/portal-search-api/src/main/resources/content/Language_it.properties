permission-filtered-search-result-accurate-count-threshold-help=Se una query di ricerca restituisce risultati di ricerca con un conteggio che è all'interno di questa soglia, il conteggio totale dopo il filtraggio di autorizzazione è garantito per essere precisi. (Automatic Translation)
permission-terms-limit=Limite di termini dell'autorizzazione (Automatic Translation)
permission-terms-limit-help=Impostare questo per limitare il numero di termini di ricerca di autorizzazione che verrà aggiunto alla query di ricerca. Se questo limite viene superato, non verranno aggiunto termini di ricerca autorizzazione. Invece, il controllo dell'autorizzazione cadrà indietro per il filtro di autorizzazione di ricerca. (Automatic Translation)
