permission-filtered-search-result-accurate-count-threshold-help=Если запрос поиска возвращает результаты поиска с счетчик, который находится в пределах этого порога, общее число после разрешения фильтрации гарантированно быть точным. (Automatic Translation)
permission-terms-limit=Предел разрешения термины (Automatic Translation)
permission-terms-limit-help=Установите это для ограничения числа разрешений Поиск терминов, которые будут добавлены к поисковому запросу. Если этот предел превышен, будут добавлены условия поиска без разрешения. Вместо этого проверка разрешений вернется к разрешение фильтр поиска. (Automatic Translation)
