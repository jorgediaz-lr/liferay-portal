nonbulk-indexing-override=Переопределение небулковой индексации (Automatic Translation)
nonbulk-indexing-override-help=Значение "истинного" приводит к тому, что измененные сущности всегда переиндексируются один за другим. По причинам производительности эта настройка обычно отключается в производстве. (Automatic Translation)
