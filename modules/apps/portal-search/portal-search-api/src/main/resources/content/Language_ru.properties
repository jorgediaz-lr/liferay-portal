indexing-batch-sizes-help=Количество документов для индексации в пакете для типов моделей, Поддержка пакетного индексации. По умолчанию используется значение 10000. Для моделей с большими документами снижение этого значения может повысить стабильность при выполнении полной повторной индексации. (Automatic Translation)
