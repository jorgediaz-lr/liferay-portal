blogs-image-maximum-file-size-description=Estabeleza o tamaño máximo para imaxes almacenadas con entradas de blog. As imaxes poden ser cargadas a través dun editor Alloy, unha imaxe de portada ou un selector de imaxe. Un valor de 0 para o tamaño máximo do ficheiro pode ser utilizado para indicar um tamaño ilimitado de ficheiro. Non obstante, o tamaño máximo de ficheiro permitido é definido na propiedade "com.liferay.portal.upload.UploadServletRequestImpl.max.size". O valor predeterminado é 5 MB.
