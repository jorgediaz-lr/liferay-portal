blogs-image-maximum-file-size-description=Установіть максимальний розмір файлів для зображень, збережених за допомогою записів блогів. Зображення можна завантажувати за допомогою редактора сплаву, зображення обкладинки або селектора зображень. Значення 0 для максимального розміру файлу можна використовувати для позначення необмеженого розміру файлу. Однак, максимальний дозволений розмір файлу встановлено у властивості "com.liferay.portal.upload.UploadServletRequestImpl.max.size". Типовим значенням є 5 мб. (Automatic Translation)
