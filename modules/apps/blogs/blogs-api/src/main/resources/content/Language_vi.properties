blogs-image-maximum-file-size-description=Đặt kích thước tệp tối đa cho hình ảnh được lưu trữ với các mục blog. Các hình ảnh có thể được tải lên bằng cách sử dụng một trình soạn thảo hợp kim, một hình ảnh bìa, hoặc một bộ chọn hình ảnh. Một giá trị của 0 cho kích thước tập tin tối đa có thể được sử dụng để chỉ ra kích thước tập tin không giới hạn. Tuy nhiên, kích thước tệp tối đa cho phép được đặt trong thuộc tính "com.liferay.portal.upload.UploadServletRequestImpl.max.size". Giá trị mặc định là 5 mb. (Automatic Translation)
