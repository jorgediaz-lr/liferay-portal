blogs-allowed-image-file-extensions-description=Đặt tiện ích mở rộng tệp hợp lệ cho hình ảnh blog. Một phần mở rộng tập tin của * sẽ cho phép tất cả các phần mở rộng tập tin. (Automatic Translation)
